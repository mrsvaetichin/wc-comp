/* ---- supabase helpers (live mode) ---- */
async function sbUpsert(table,row){ try{ await supa.from(table).upsert(row); }catch(e){ console.error(e); toast("Sync error"); } }

/* ============================================================================
   🖼️  RENDER
   ============================================================================ */
// 🌍 Localized to each viewer's timezone. We grab the IANA name once (e.g. "Europe/Stockholm")
// and the browser handles DST + locale formatting; we append a short TZ tag (CET, ET, JST…) so
// users from different countries always know what clock they're looking at.
const USER_TZ = (function(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || undefined; }catch(e){ return undefined; } })();
const USER_LOCALE = (function(){ try{ return navigator.language || (navigator.languages && navigator.languages[0]) || null; }catch(e){ return null; } })();
// 🌐 "Where from" snapshot captured at signup (timezone + locale). Combined with the user's
// fav_team flag in the profile, this is a privacy-friendly proxy for geography — no IP
// tracking, no geolocation API permission prompt, just what the browser already exposes.
function clientSignupInfo(){ return { signup_tz: USER_TZ || null, signup_locale: USER_LOCALE || null }; }
// Friendly "X minutes ago"/"in 3 days" string for the admin audit view.
function relativeTime(iso){ if(!iso) return "—"; const t=new Date(iso).getTime(); if(isNaN(t)) return "—";
  const dx=Date.now()-t, abs=Math.abs(dx), sgn=dx>=0?"ago":"from now";
  const units=[["year",365.25*864e5],["month",30.4*864e5],["week",7*864e5],["day",864e5],["hour",36e5],["minute",6e4],["second",1000]];
  for(const [n,ms] of units){ const v=Math.floor(abs/ms); if(v>=1) return `${v} ${n}${v===1?'':'s'} ${sgn}`; }
  return "just now"; }
// Pretty IANA timezone display: "Europe/Stockholm" → "Stockholm (Europe)"
function prettyTZ(tz){ if(!tz) return "—"; const [region,city]=String(tz).split("/"); return city?`${city.replace(/_/g," ")} (${region})`:tz; }
function tzShort(d){ try{ const p=new Intl.DateTimeFormat(undefined,{timeZoneName:"short"}).formatToParts(d||new Date()); const t=p.find(x=>x.type==="timeZoneName"); return t?t.value:""; }catch(e){ return ""; } }
function fmtKick(iso){
  const d=new Date(iso);
  // Show in the viewer's local timezone (so a friend in Tokyo and a friend in Stockholm each
  // see kickoff in their own clock). Falls back gracefully if Intl is unavailable.
  try{ return d.toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+" "+tzShort(d); }
  catch(e){ return d.toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
}
// 🕐 Format a remaining-milliseconds value into a live countdown string.
// Always includes seconds (the live ticker updates every 1s), and zero-pads each
// unit-after-the-largest so the text doesn't visually jitter as digits change.
function fmtCountdown(ms){
  if(ms<=0) return null;
  const d=Math.floor(ms/864e5);
  const h=Math.floor((ms%864e5)/36e5);
  const m=Math.floor((ms%36e5)/6e4);
  const s=Math.floor((ms%6e4)/1000);
  const pad=n=>String(n).padStart(2,'0');
  if(d>0) return `${d}d ${pad(h)}h ${pad(m)}m ${pad(s)}s`;
  if(h>0) return `${h}h ${pad(m)}m ${pad(s)}s`;
  if(m>0) return `${m}m ${pad(s)}s`;
  return `${s}s`;
}
function countdown(iso){ return fmtCountdown(new Date(iso)-Date.now()); }
// 🕐 Live ticker — re-evaluates every countdown element on the page once per second.
// Tag a span/div with data-tick=… so its text refreshes without a full re-render (keeps focus, inputs, scroll).
//   data-tick="kickoff" data-cd="<iso>"             → countdown(iso)
//   data-tick="round"   data-md="1|2|3"             → roundCountdown(md)
//   data-tick="extras"                              → extrasCountdown()
//   data-tick="round-inline" data-md="1"            → live "X left" string (no "frozen" fallback)
let _tickerStarted=false;
function startTicker(){
  if(_tickerStarted) return; _tickerStarted=true;
  setInterval(()=>{
    document.querySelectorAll('[data-tick]').forEach(el=>{
      const k=el.dataset.tick;
      try{
        if(k==='kickoff'){ const v=countdown(el.dataset.cd); el.textContent = v || (el.dataset.kickoffLabel || 'KICKOFF!'); }
        else if(k==='round'){ const md=+el.dataset.md; el.textContent = roundLocked(md)?'picks frozen':(roundCountdown(md)||'KICKOFF!'); }
        else if(k==='round-inline'){ const md=+el.dataset.md; const v=roundCountdown(md); if(v) el.textContent = v; }
        else if(k==='extras'){ el.textContent = extrasLocked()?'sealed for the tournament':(extrasCountdown()||'KICKOFF!'); }
        else if(k==='extras-inline'){ const v=extrasCountdown(); if(v) el.textContent = v; }
      }catch(e){}
    });
  }, 1000);
}

// a player's cumulative MATCH-based points as of a moment (score predictions+banker, fan bonus, group survivors once a group is done, minus re-pick costs incurred)
function matchPtsAsOf(uid, cutoff){
  const s=DB.settings; let pts=0;
  const fin=DB.matches.filter(m=>m.status==="finished" && new Date(m.kickoff).getTime()<=cutoff);
  fin.forEach(m=>{ const pr=effectivePick(uid,m.id);
    if(pr&&pr.hp!=null&&pr.ap!=null){ const exact=pr.hp===m.hs&&pr.ap===m.as; const outcome=Math.sign(pr.hp-pr.ap)===Math.sign(m.hs-m.as);
      let add=exact?mpExact(m):outcome?mpResult(m):0; if(pr.banker) add*=2; pts+=add; }
  });
  const fav=(profileById(uid)||{}).team;
  if(fav) fin.forEach(m=>{ if((m.home===fav&&m.hs>m.as)||(m.away===fav&&m.as>m.hs)) pts+=FAN_BONUS; });
  ADV.filter(a=>a.user===uid).forEach(a=>{ const gm=DB.matches.filter(m=>m.grp===a.grp);
    const done=gm.length>0 && gm.every(m=>m.status==="finished" && new Date(m.kickoff).getTime()<=cutoff);
    if(!done) return; const st=groupStandings(a.grp); if(st[0]&&st[1]&&[st[0].id,st[1].id].includes(a.team)) pts+=s.pts_advance; });
  (DB.repicks||[]).filter(r=>r.user===uid).forEach(r=>{ const m=DB.matches.find(x=>x.id===r.match);
    if(m&&m.status==="finished"&&new Date(m.kickoff).getTime()<=cutoff) pts-=REPICK_COST; });
  return pts;
}
// generic line chart — always draws the axes/grid; lines only appear once there are ≥2 points.
// labels:[strings]  mem:[{name,me,series:[nums],final}]  emptyMsg shown inside the empty frame.
// 🎭 THE RACE CHART. Every render is a tiny comedy: all lines launch flat off the
// baseline, then sprint toward the WRONG endings (first chaos phase literally hands
// the lead to the last-placed player), swap destinations twice more like they're
// chasing each other, overshoot dramatically… and only then snap into their true,
// correct final positions. The leader's 👑 rides (and wobbles on) the winning line
// the whole way; a floating ❓ hangs over the chart until the dust settles. The final
// resting state is ALWAYS the real data — only the journey is nonsense.
// Pure SVG/SMIL (animate on polyline points) — no JS frame loop, no perf cost.
function lineChartSVG(labels, mem, emptyMsg){
  const W=320,H=185,padL=22,padR=10,padT=14,padB=24;
  const hasData = labels.length>=2 && mem.length>0;
  const allv = mem.flatMap(m=>m.series);
  const yMax=Math.max(4, ...(allv.length?allv:[0]));      // default 0–4 scale on an empty board
  const yMin=Math.min(0, ...(allv.length?allv:[0]));
  const x=i=>padL+(labels.length<=1?(W-padL-padR)/2:i*(W-padL-padR)/(labels.length-1));
  const y=v=>padT+(1-(v-yMin)/((yMax-yMin)||1))*(H-padT-padB);
  // 🎨 SVG defs: animation styles. Unique id namespace per chart instance.
  const uid = "lc"+Math.random().toString(36).slice(2,8);
  const RACE_DUR=6;   // seconds of total drama before the truth lands — quick enough to not overstay the joke
  // ⚡ Perf note: no SVG blur filters here — feGaussianBlur on elements that morph every
  // frame forces Chrome to re-render the filter region continuously and tanks the page
  // during the 9s race. Plain strokes animate cheaply on the GPU-friendly path.
  const defs = `<defs>
    <style>
      .${uid}-leader{animation:${uid}-pulse 1.6s ease-in-out infinite;animation-delay:${RACE_DUR}s;transform-origin:center;transform-box:fill-box}
      .${uid}-crown{animation:${uid}-wob .8s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
      .${uid}-face{animation:${uid}-bob .7s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
      .${uid}-q{animation:${uid}-wob .8s ease-in-out infinite alternate, ${uid}-qfade ${(RACE_DUR*0.92).toFixed(1)}s linear forwards;transform-origin:center;transform-box:fill-box}
      .${uid}-name{opacity:0;transition:opacity .15s;pointer-events:none}
      .${uid}-hit{cursor:pointer}
      .${uid}-hit:hover .${uid}-name{opacity:1}
      @keyframes ${uid}-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
      @keyframes ${uid}-wob{from{transform:rotate(-16deg) scale(1)}to{transform:rotate(16deg) scale(1.22)}}
      @keyframes ${uid}-bob{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
      @keyframes ${uid}-qfade{0%,78%{opacity:1}100%{opacity:0}}
    </style>
  </defs>`;
  let grid='';
  for(let t=0;t<=3;t++){ const val=yMin+(yMax-yMin)*t/3; const yy=y(val);
    grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" style="stroke:var(--line);stroke-width:.5"/><text x="${padL-4}" y="${(yy+3).toFixed(1)}" text-anchor="end" style="fill:var(--muted);font-size:8px">${Math.round(val)}</text>`; }
  grid+=`<line x1="${padL}" y1="${y(yMin).toFixed(1)}" x2="${W-padR}" y2="${y(yMin).toFixed(1)}" style="stroke:var(--line);stroke-width:1"/>`;
  let body='';
  if(hasData){
    const step=Math.ceil(labels.length/6);
    labels.forEach((c,i)=>{ if(!c) return; if(i%step!==0 && i!==labels.length-1) return;
      body+=`<text x="${x(i).toFixed(1)}" y="${H-7}" text-anchor="middle" style="fill:var(--muted);font-size:8px">${escapeHtml(c)}</text>`; });
    // ── Build the chaos phases ──────────────────────────────────────────────
    // Each phase hands every line a "fake finish" stolen from the SHUFFLED list of
    // real finals — so the pack visibly chases each other's endings before the truth.
    const N=labels.length;
    const finals=mem.map(mm=>mm.series[mm.series.length-1]);
    const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
    const fakeA=finals.slice().reverse();              // phase 1: dead-last takes the lead 🤡
    const fakeB=shuffle(finals), fakeC=shuffle(finals); // phases 2–3: total anarchy
    const noise=()=> (Math.random()-0.5)*yMax*0.16;     // jittery, panicky lines
    const clampV=v=> Math.max(yMin, Math.min(yMax*1.04, v));
    // 🌊 Guaranteed curviness, even on day 1. A cumulative line between two real data
    // points is mathematically straight — so every series is UPSAMPLED (≥2 interior
    // points per segment) and the interior points get a gentle alternating sine "bow".
    // Lines still pass EXACTLY through the true data values at every matchday knot;
    // only the path between knots sways. Chaos phases are generated at the same
    // resolution, so the morphs get wavier too.
    const R=Math.max(12,(N-1)*3+1);                     // render resolution
    const resample=(vals,wavy)=>Array.from({length:R},(_,j)=>{
      const f=j*(N-1)/(R-1), i0=Math.floor(f), i1=Math.min(N-1,i0+1), t=f-i0;
      let v=vals[i0]*(1-t)+vals[i1]*t;
      if(wavy && t>0.01 && t<0.99) v+=Math.sin(Math.PI*t)*((i0%2)?-1:1)*(yMax-yMin)*0.03;
      return v;
    });
    const traj=target=> Array.from({length:R},(_,j)=> j===0?0:clampV(j/(R-1)*target+noise()));
    // Smooth Catmull-Rom → cubic-Bézier path. Every phase has the same point count,
    // so the path command structure is identical and SMIL can morph `d` between phases.
    const pathOf=vals=>{
      const X=i=>padL+i*(W-padL-padR)/(vals.length-1);
      const P=vals.map((v,i)=>[X(i),y(v)]);
      let d=`M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
      for(let i=0;i<P.length-1;i++){
        const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||p2;
        const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
        const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
        d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
      }
      return d;
    };
    const yBase=y(yMin).toFixed(1);
    const areaOf=vals=> pathOf(vals)+` L${(W-padR).toFixed(1)} ${yBase} L${padL.toFixed(1)} ${yBase} Z`;
    const keyTimes="0;0.2;0.4;0.6;0.84;1";              // flat → chaos×3 → overshoot → truth (settles sooner)
    const keySplines=Array(5).fill(".42 0 .58 1").join(";");
    body+=mem.map((m,idx)=>{
      const me = m.me;
      const col = me ? '#ffffff' : LINE_PAL[idx%LINE_PAL.length];
      const flat=new Array(R).fill(0);
      const over=resample(m.series.map((v,i)=> i===0?v:clampV(v*1.22+yMax*0.03)), true);  // elastic overshoot before settling
      const sets=[flat, traj(fakeA[idx]), traj(fakeB[idx]), traj(fakeC[idx]), over, resample(m.series,true)];
      const begin=(idx*0.15).toFixed(2);                // staggered launch, like sprinters
      const anim=(attr,values)=>`<animate attributeName="${attr}" dur="${RACE_DUR}s" begin="${begin}s" fill="freeze" calcMode="spline" keyTimes="${keyTimes}" keySplines="${keySplines}" values="${values}"/>`;
      const ex=Math.min(x(N-1), W-11);                  // keep the face badge inside the frame
      const lineW = me ? 3 : 2;
      const isLeader = idx===0;
      // Subtle gradient fill under the curve — only for the leader and "me" (races along too)
      let area = '';
      if(me || isLeader){
        area = `<path d="${areaOf(flat)}" fill="${col}" stroke="none" opacity=".10">${anim('d', sets.map(areaOf).join(";"))}</path>`;
      }
      // 🏃 The player's FACE rides the tip of their line for the whole race — photo
      // avatar if they uploaded one, emoji badge otherwise — bobbing side to side,
      // dragged through every fake lead change. Leader's 👑 sits on top of their face.
      const tVals=sets.map(s=>`${ex.toFixed(1)} ${y(s[s.length-1]).toFixed(1)}`).join(";");
      const faceInner = m.avatar
        ? `<clipPath id="${uid}-fc${idx}"><circle r="8"/></clipPath><image x="-8" y="-8" width="16" height="16" preserveAspectRatio="xMidYMid slice" href="${m.avatar}" clip-path="url(#${uid}-fc${idx})"/>`
        : `<text y="3.5" text-anchor="middle" style="font-size:11px">${m.emoji||'🙂'}</text>`;
      const crown = isLeader ? `<text y="-13" text-anchor="middle" style="font-size:11px" class="${uid}-crown">👑</text>` : '';
      // Hover/tap a face → its name label fades in beside it (native <title> kept as a
      // fallback). Invisible r=13 hit circle makes the target easy to grab; the label sits
      // OUTSIDE the bobbing group so it stays steady while the face wobbles.
      const face = `<g class="${uid}-hit" transform="translate(${ex.toFixed(1)},${y(0).toFixed(1)})">
        <title>${escapeHtml(m.name)}${m.me?' (you)':''} · ${escapeHtml(m.valLabel||String(m.final??''))}</title>
        <animateTransform attributeName="transform" type="translate" dur="${RACE_DUR}s" begin="${begin}s" fill="freeze" calcMode="spline" keyTimes="${keyTimes}" keySplines="${keySplines}" values="${tVals}"/>
        <circle r="13" fill="#000" opacity="0"/>
        <g class="${uid}-face" style="animation-duration:${(0.55+(idx%5)*0.09).toFixed(2)}s">
          <circle r="9" fill="var(--card)" stroke="${col}" stroke-width="2" class="${isLeader?uid+'-leader':''}"/>
          ${faceInner}${crown}
        </g>
        <text class="${uid}-name" x="-14" y="3.5" text-anchor="end" style="font-size:9.5px;font-weight:700;fill:#fff;stroke:#0a1a2e;stroke-width:3px;paint-order:stroke">${escapeHtml(m.name)}${m.me?' (you)':''} · ${escapeHtml(m.valLabel||String(m.final??''))}</text>
      </g>`;
      return area
        + `<path d="${pathOf(flat)}" fill="none" stroke="${col}" stroke-width="${lineW}" stroke-linejoin="round" stroke-linecap="round" opacity="${me?1:.92}">${anim('d', sets.map(pathOf).join(";"))}</path>`
        + face;
    }).join("");
    // ❓ hovers over the chart while the race is still anyone's guess, then pops away.
    body+=`<text x="${(W/2).toFixed(1)}" y="${(padT+12).toFixed(1)}" text-anchor="middle" style="font-size:15px" class="${uid}-q">❓</text>`;
  } else {
    body+=`<text x="${(W/2).toFixed(1)}" y="${(padT+(H-padT-padB)/2+3).toFixed(1)}" text-anchor="middle" style="fill:var(--muted);font-size:10px">${escapeHtml(emptyMsg)}</text>`;
  }
  return `<div class="linechart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="line chart">${defs}${grid}${body}</svg></div>`;
}
function lcLegend(mem){
  if(!mem.length) return '';

    return `<span class="lc-leg ${m.me?'me':''}"><span class="lc-sw" style="background:${col}"></span>${escapeHtml(m.name)}${m.me?' (you)':''} · ${m.valLabel}</span>`; }).join("")+(mem.length>8?`<span class="lc-leg muted">+${mem.length-8} more</span>`:'')+`</div>`;

function lcCard(title, sub, gotoTab, linkText, svg, legend){

// Points progression — cumulative match points by matchday (a 0-point origin gives a line from the first matchday)
function pointsLineCard(){
  const days=[...new Set(DB.matches.filter(m=>m.status==="finished").map(m=>dateKey(m.kickoff)))].sort();
  // UTC-consistent day buckets (see banterLineCard for the same fix + reasoning).
  const cps=days.map(d=>({d, cut:new Date(d+"T23:59:59Z").getTime()}));
  if(cps.length) cps[cps.length-1].cut = Math.max(cps[cps.length-1].cut, Date.now());
  let mem=leagueMembers(LG).map(p=>({id:p.id, name:p.name.split(" ")[0], me:p.id===ME.id,
    emoji:p.emoji, avatar:p.avatar||null,                              // 🏃 face badge that races on the line tip
    series:[0, ...cps.map(c=>matchPtsAsOf(p.id,c.cut))]}));            // leading 0 = pre-tournament baseline
  // Force last point = live total for every member (defends against TZ drift).
  mem.forEach(m=>{ if(m.series.length) m.series[m.series.length-1]=scoreFor(m.id).pts; m.final=m.series[m.series.length-1]; m.valLabel=`${m.final}`; });
  mem.sort((a,b)=> b.final-a.final || a.name.localeCompare(b.name));
  mem=mem.slice(0,10);
  const labels=days.length ? ['', ...days.map(d=>{const a=d.split("-");return (+a[1])+"/"+(+a[2]);})] : [];
  const svg=lineChartSVG(labels, mem, 'Lines appear after kickoff ⚽');
  const legend = labels.length>=2 ? lcLegend(mem) : '';
  return lcCard('📈 Points race', 'Cumulative points by matchday', 'points', 'Table →', svg, legend);
}
// Banter progression — cumulative ❤️ likes received, by day
function banterLineCard(){
  // 💬 Banter race: cumulative ❤️ likes received by each banter author, by day.
  // Aggregate FROM the like events (not from the current league member list) so anyone
  // who's ever received a like in this league shows up — including authors whose comments
  // are still scored even if they were later removed from the league roster. Build a
  // commentId→authorId index once for O(1) lookup so the chart is also a lot quicker.
  const likes    = DB.likes    || [];
  const comments = DB.comments || [];
  const cards    = DB.cards    || [];
  const author = Object.create(null);
  comments.forEach(c => { author[c.id] = c.user; });
  // Skip likes on sent-off (red-carded) posts — they earn 0 in scoring, so they shouldn't
  // inflate the chart either. We do this once via a Set lookup for speed.
  const redSet = new Set();
  cards.forEach(cd => { if(cd.kind==="red") redSet.add(cd.comment); });
  const usableLikes = likes.filter(l => !redSet.has(l.comment));
  // 📅 Day buckets — UTC throughout so the dateKey (UTC date) and the cut (UTC end of day)
  //    speak the same language. The old code mixed UTC dates with local-time cuts, which
  //    silently dropped likes whose UTC timestamp fell between the viewer's local midnight
  //    and the next UTC midnight — chart endpoints ended up at 0 while the player's actual
  //    total was 1+ (the visible bug).
  const days = [...new Set(usableLikes.map(l=>dateKey(l.created)))].sort();
  const cps  = days.map(d=>({d, cut:new Date(d+"T23:59:59Z").getTime()}));
  // Belt-and-braces: the last cut is bumped to "now" so the rightmost data point reflects
  //   every like that's hit the DB so far, even if the cut math drifted by a millisecond.
  if(cps.length) cps[cps.length-1].cut = Math.max(cps[cps.length-1].cut, Date.now());
  // Final totals per user, computed from EARNING likes (red-carded ones already excluded above)
  const totals = Object.create(null);
  usableLikes.forEach(l => { const u = author[l.comment]; if(u) totals[u] = (totals[u]||0) + 1; });
  let mem = Object.keys(totals).map(uid => {
    const p = profileById(uid);
    if(!p || p.is_admin) return null;          // never plot admins
    const series = [0, ...cps.map(c=>{
      let n = 0;
      for(const l of usableLikes){
        if(author[l.comment]!==uid) continue;
        if(new Date(l.created).getTime() <= c.cut) n++;
      }
      return n;
    })];
    // Safety net: force the line's final point to match the verified total. Cheap defence
    // against any future date-math edge case — what the legend says is what the chart shows.
    if(series.length) series[series.length-1] = totals[uid];
    return {
      name: p.name.split(" ")[0], me: uid===ME.id, final: totals[uid],
      emoji: p.emoji, avatar: p.avatar||null,   // 🏃 face badge that races on the line tip
      valLabel: `❤️ ${totals[uid]}${totals[uid]>=BANTER_CAP?` · capped at ${BANTER_CAP}`:''}`, series
    };
  }).filter(Boolean);
  mem.sort((a,b) => b.final-a.final || a.name.localeCompare(b.name));
  mem = mem.slice(0,10);
  const labels = days.length ? ['', ...days.map(d=>{const a=d.split("-");return (+a[1])+"/"+(+a[2]);})] : [];
  const svg = lineChartSVG(labels, mem, 'Lines appear once likes roll in 💬');
  const legend = (labels.length>=2 && mem.length) ? lcLegend(mem) : '';
  return lcCard('💬 Banter race', 'Cumulative ❤️ likes received · 1 like = 1 point', 'banter', 'Banter board →', svg, legend);
}

    } else if(!list.length){

    } else {
      const koMd=KO_MD[koStage], pickedRound=list.filter(m=>hasPicked(m.id)).length;
      html+=`<div class="card"><h3>⚽ Make your picks · ${stageLabel}</h3>
        <div class="small muted">Predict a scoreline for <b>every match in the round</b> — knockout bets are worth more: <b>${exPts} pts</b> spot-on, <b>${rePts} pts</b> for the right result${koStage==='f'?' (the Final pays the most)':''}. Pick <b>one match</b> as your ⭐ <b>Banker</b> for double. Knockout rounds run over several days, so <b>each match locks on its own</b> — edit any pick until 30 min before <b>that</b> game kicks off.</div>

    }

  }

    :`<span class="chip open">Grp ${m.grp} · MD${m.md}</span>`;
  return `<div class="match"><div class="meta"><span class="small muted">${fmtKick(m.kickoff)}</span>${tag}</div>${inner}</div>`;
}

        <div class="bbody">${escapeHtml(c.body)}</div>
        <div class="bactions" data-stop="1">
          ${likeCount(c.id)?`<span class="likecount${redOnPost?' wiped':''}" title="${redOnPost?'Likes earn 0 pts on a sent-off post':'❤️ from the crowd'}">❤️ ${likeCount(c.id)}${redOnPost?' · wiped':''}</span>`:''}
          ${mine
            ? (likeCount(c.id)?'':'<span class="tiny muted">your post</span>')
            : redOnPost
              ? '<span class="tiny muted">🟥 sent off · no actions</span>'
              : locked
                ? '<span class="tiny muted">🔒 round locked</span>'
                : `<button class="likebtn ${iLiked(c.id)?'on':''}" data-like="${c.id}">${iLiked(c.id)?'❤️ Liked':'🤍 Like'}</button>
                   ${myc
                     ? `<span class="tiny muted">you showed ${myc.kind==='red'?'🟥':'🟨'}</span>`
                     : next==='red'
                       ? `<button class="cardbtn redc" data-card="red" data-cm="${c.id}" title="Two 🟨 already — your 🟥 sends it off">🟥 Send off (2/2 already)</button>`

                         : ''}`
          }
        </div>
      </div>
    </div>`;
  });
  return html;
}

/* ---------- LEADERBOARD ---------- */
let boardTab="points";
function boardToggle(){ return `<div class="toggle" style="margin-top:8px"><button class="${boardTab==='points'?'on':''}" data-boardtab="points">🏅 Points</button><button class="${boardTab==='banter'?'on':''}" data-boardtab="banter">💬 Banter</button></div>`; }
function banterBoard(){
  // 'likes' here = EARNING likes (skips red-carded posts) so ranking + bonus stay in sync.
  return leagueMembers(LG).map(p=>{ const posts=DB.comments.filter(c=>c.user===p.id);
    const uc=userCards(p.id);
    return {user:p.id, posts:posts.length, likes:posts.reduce((s,c)=>s+earningLikeCount(c.id),0), yellow:uc.yellow, red:uc.red, sentOff:uc.sentOff};
  }).sort((a,b)=> b.likes-a.likes || b.posts-a.posts || a.user.localeCompare(b.user));
}
function viewBanterBoard(){

    html+=`<div class="lbrow ${me}" data-vp="${r.user}" style="cursor:pointer">
      <div class="pos medal">${medal}</div>
      <div class="avatar" title="${escapeHtml(u.name)}" style="width:30px;height:30px;font-size:15px">${avatarInner(u)}</div>

function viewBoard(){

  const trashLast=[`is holding up the table like a true legend 🛗`,`still believes in the comeback 🫡`,`picked vibes over logic 🔮`][last.id.length%3];

      return `<div class="pod p${place}"><div class="podav" title="${escapeHtml(r.name)}">${r.emoji}</div><div class="podname">${r.name.split(" ")[0]}</div><div class="podbar" style="height:${hgt}px">${place===1?'👑':place===2?'🥈':'🥉'}<div class="podsc">${r.pts}p</div></div></div>`;}).join("")+`</div>
      <div class="trash center">👑 ${top.emoji} <b>${top.name}</b> ${trashTop}</div></div>`;
  }
  lb.forEach(r=>{

    const fire=r.st.streak>=2?`<span class="fire">🔥${r.st.streak}</span>`:'';
    const badges=r.badges.map(b=>`<span title="${b[1]}: ${b[2]}">${b[0]}</span>`).join("");

      <div class="nm">${r.name}${r.team&&teamById(r.team)?` <span title="Supports ${teamById(r.team).name}">${teamById(r.team).flag}</span>`:''}${me?' <span class="tiny" style="color:var(--cyan)">(you)</span>':''} ${fire}<small class="badges">${badges||'&nbsp;'}</small></div>
      <div class="sc">${r.pts+(r.lp||0)}${r.lp?` <span class="tiny" style="color:var(--gold);font-weight:800" title="includes +${r.lp} provisional from live games — becomes official at full time">⚡+${r.lp}</span>`:''} pts</div>

  html+=`<div class="card"><h3>🏆 Projected payouts</h3><div class="small muted">If the tournament ended right now:</div>`;
  ["🥇 1st","🥈 2nd","🥉 3rd"].forEach((lbl,i)=>{

    html+=`<div class="standrow"><span style="width:40px">${lbl}</span>
      <span class="avatar" style="width:26px;height:26px;font-size:13px">${avatarInner(winner)}</span>

  html+=`<div class="small muted" style="margin-top:8px">💡 The app just tracks who's in. Settle the real cash however you like (Venmo, cash, IOUs on a napkin).</div></div>`;
  return html;
}

/* ----------------------------------------------------------------------------
   🛠️🔍  Admin · single-user detail (audit view)
   Everything an admin could want to know about one player in one scroll: identity,
   where they signed up from (timezone + locale), when, every league they're in
   with per-league points / picks / paid status, full activity totals (banter,
   likes, cards, re-picks), and every match pick they've ever locked — grouped
   by league + sorted by kickoff.
   ---------------------------------------------------------------------------- */
/* ----------------------------------------------------------------------------
   🛠️📊  CRM HELPERS — overview, sortable user/league tables, activity feed
   ---------------------------------------------------------------------------- */
// Tiny absolute-date formatter that always shows the actual date+time (the relative tag is on the side).
// We render kickoff times via fmtKick (drops in the TZ tag) — these timestamps reuse that.
function fmtAbs(iso){ return iso ? fmtKick(iso) : "—"; }
// Sortable-table header cell. Calling `data-sort-users` / `data-sort-leagues` toggles direction.
function thSort(scope, field, label, curState){
  const [f,d] = curState.split(":");
  const on = f===field;
  return `<th class="${on?'sorted':''}" data-sort-${scope}="${field}">${label}<span class="arr">${on?(d==="asc"?'▲':'▼'):'▴▾'}</span></th>`;
}
function compareBy(field, dir){
  const mul = dir==="asc" ? 1 : -1;
  return (a,b)=>{
    const av=a[field], bv=b[field];
    if(av==null && bv==null) return 0;
    if(av==null) return 1;       // nulls always last
    if(bv==null) return -1;
    if(typeof av==="number" && typeof bv==="number") return (av-bv)*mul;
    return String(av).localeCompare(String(bv))*mul;
  };
}
// 📊 Overview dashboard: KPIs + recent activity preview + currently-online list.
function adminOverview(){
  const players  = DB.profiles.filter(p=>!p.is_admin);
  const adminsN  = DB.profiles.filter(p=>p.is_admin).length;
  const leagues  = (ALL_LEAGUES.length?ALL_LEAGUES:LEAGUES);
  const picks    = ALL.pred.filter(x=>!x.advance && !x.ko);
  const props    = ALL.pans;
  const banter   = ALL.comments;
  const bracket  = (ALL.bracket||[]);
  const now      = Date.now();
  const dayAgo   = now - 864e5;
  const weekAgo  = now - 7*864e5;
  const activeToday = players.filter(u=>u.last_seen_at && new Date(u.last_seen_at).getTime() > dayAgo).length;
  const activeWeek  = players.filter(u=>u.last_seen_at && new Date(u.last_seen_at).getTime() > weekAgo).length;
  const signupsWeek = players.filter(u=>u.created_at && new Date(u.created_at).getTime() > weekAgo).length;
  const leaguesWeek = leagues.filter(l=>l.created_at && new Date(l.created_at).getTime() > weekAgo).length;
  const banterToday = banter.filter(c=>c.created && new Date(c.created).getTime() > dayAgo).length;
  const totalPotByCcy = {};
  leagues.forEach(l=>{
    const ccy = l.currency || "USD";
    const mems = MEMBERS.filter(m=>m.league===l.id).length;
    totalPotByCcy[ccy] = (totalPotByCcy[ccy]||0) + mems * (l.buy_in||0);
  });
  const potStr = Object.entries(totalPotByCcy).map(([c,v])=>`${v.toLocaleString()} ${c}`).join(" + ") || "—";
  // KPI grid
  const kpis = `<div class="kpigrid">
    <div class="kpicard players"><div class="v">${players.length}</div><div class="k">Total players</div>${signupsWeek?`<div class="delta">+${signupsWeek} this week</div>`:''}</div>
    <div class="kpicard leagues"><div class="v">${leagues.length}</div><div class="k">Leagues</div>${leaguesWeek?`<div class="delta">+${leaguesWeek} this week</div>`:''}</div>
    <div class="kpicard active"><div class="v">${activeToday}</div><div class="k">Active today</div><div class="delta">${activeWeek} this week</div></div>
    <div class="kpicard picks"><div class="v">${picks.length}</div><div class="k">Match picks</div></div>
    <div class="kpicard banter"><div class="v">${banter.length}</div><div class="k">Banter posts</div>${banterToday?`<div class="delta">+${banterToday} today</div>`:''}</div>
    <div class="kpicard pot"><div class="v" style="font-size:22px;line-height:1.2;padding-top:8px">${potStr}</div><div class="k">Total pot</div></div>
    <div class="kpicard"><div class="v">${MEMBERS.length}</div><div class="k">Memberships</div></div>
    <div class="kpicard"><div class="v">${props.length}</div><div class="k">Extras locked</div></div>
    <div class="kpicard"><div class="v">${bracket.length}</div><div class="k">Bracket picks</div></div>
    <div class="kpicard"><div class="v">${adminsN}</div><div class="k">Admin accounts</div></div>
  </div>`;
  // Recent activity preview (top 12 events)
  const acts = buildActivityEvents().slice(0,12);
  const feed = acts.length
    ? `<div class="actfeed">${acts.map(renderActivityRow).join("")}</div>`
    : `<div class="empty"><div class="e">🪺</div>No activity yet — once players start signing up, joining leagues, and posting banter, you'll see it here in real time.</div>`;
  return `<div class="adminoverview">
    <div class="ovleft">${kpis}
      <div class="card"><h3>🆕 Newest players</h3>${
        players.slice().sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0)).slice(0,6).map(p=>{
          const fav = p.team && teamById(p.team);
          return `<div class="actrow"><span class="actic">${avatarInner(p)}</span>
            <span class="actwhat"><b>${escapeHtml(p.name)}</b>${fav?' '+fav.flag:''}<span class="muted"> from ${prettyTZ(p.signup_tz)}</span></span>
            <span class="actwhen">${relativeTime(p.created_at)}</span></div>`;
        }).join("") || `<div class="small muted">No players yet.</div>`
      }</div>
      <div class="card"><h3>🏆 Newest leagues</h3>${
        leagues.slice().sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0)).slice(0,6).map(l=>{
          const creator = (DB.profiles.find(p=>p.id===l.created_by)||{}).name || "—";
          const mems = MEMBERS.filter(m=>m.league===l.id).length;
          return `<div class="actrow"><span class="actic">🏆</span>
            <span class="actwhat"><b>${escapeHtml(l.name)}</b><span class="muted"> · ${mems} member${mems===1?'':'s'} · ${money(l.buy_in)} buy-in · invite ${l.code}</span></span>
            <span class="actwhen">${relativeTime(l.created_at)}</span></div>`;
        }).join("") || `<div class="small muted">No leagues yet.</div>`
      }</div>
    </div>
    <div class="ovright">
      <div class="card"><div class="spread"><h3>📜 Recent activity</h3><button class="btn" data-atab="activity" style="padding:5px 10px;font-size:12px;border-color:var(--cyan);color:var(--cyan)">Full log →</button></div>
        ${feed}

}

// 👥 Sortable + searchable players table.
function adminUsersTable(){
  const filterQ = (adminUserFilter||"").toLowerCase().trim();
  const scope = adminUserScope;
  let rows = DB.profiles.slice();
  if(scope==="players") rows = rows.filter(p=>!p.is_admin);
  else if(scope==="admins") rows = rows.filter(p=> p.is_admin);
  if(filterQ){
    rows = rows.filter(p=>{
      const hay = `${p.name||''} ${p.email||''} ${p.signup_tz||''} ${p.signup_locale||''} ${(p.team&&teamById(p.team)||{}).name||''}`.toLowerCase();
      return hay.includes(filterQ);
    });
  }
  // Enrich with derived stats so we can sort by them
  rows = rows.map(p=>{
    const leagueCount = new Set(MEMBERS.filter(m=>m.user===p.id).map(m=>m.league)).size;
    const pickCount = ALL.pred.filter(x=>x.user===p.id && !x.advance && !x.ko).length;
    const banterCount = ALL.comments.filter(c=>c.user===p.id).length;
    return Object.assign({}, p, {leagueCount, pickCount, banterCount,
      created_ts: p.created_at?new Date(p.created_at).getTime():0,
      seen_ts: p.last_seen_at?new Date(p.last_seen_at).getTime():0
    });
  });
  const [f,d] = adminUserSort.split(":");
  const sortField = ({created_at:"created_ts", last_seen_at:"seen_ts", name:"name", leagues:"leagueCount", picks:"pickCount", banter:"banterCount", tz:"signup_tz"}[f])||"seen_ts";
  rows.sort(compareBy(sortField, d));

  const headRow = `<tr>
    ${thSort("users","name","Player", adminUserSort)}
    <th>Nation</th>
    ${thSort("users","tz","Signed up from", adminUserSort)}
    ${thSort("users","created_at","Joined", adminUserSort)}
    ${thSort("users","last_seen_at","Last seen", adminUserSort)}
    ${thSort("users","leagues","Lg", adminUserSort)}
    ${thSort("users","picks","Picks", adminUserSort)}
    ${thSort("users","banter","💬", adminUserSort)}
    <th>Actions</th>
  </tr>`;
  const body = rows.map(p=>{
    const isMe = p.id===ME.id;
    const fav = p.team && teamById(p.team);
    const adminTag = p.is_admin ? '<span class="pilladmin" style="margin-left:6px">ADMIN</span>' : '';
    return `<tr data-rowuser="${p.id}" style="cursor:pointer">
      <td><div class="cellnm"><div class="avatar">${avatarInner(p)}</div><div class="nm">${escapeHtml(p.name)}${isMe?' <span class="tiny" style="color:var(--cyan)">(you)</span>':''}${adminTag}</div></div></td>
      <td>${fav?`${fav.flag} ${fav.name}`:'<span class="muted">—</span>'}</td>
      <td>${p.signup_tz?prettyTZ(p.signup_tz):'<span class="muted">—</span>'}${p.signup_locale?` <span class="tiny muted">· ${escapeHtml(p.signup_locale)}</span>`:''}</td>
      <td><div class="tinydate">${p.created_at?fmtKick(p.created_at):'<span class="muted">—</span>'}${p.created_at?`<span class="ago">${relativeTime(p.created_at)}</span>`:''}</div></td>
      <td><div class="tinydate">${p.last_seen_at?fmtKick(p.last_seen_at):'<span class="muted">never</span>'}${p.last_seen_at?`<span class="ago">${relativeTime(p.last_seen_at)}</span>`:''}</div></td>
      <td>${p.leagueCount}</td>
      <td>${p.pickCount}</td>
      <td>${p.banterCount}</td>
      <td><div class="rowacts" data-stop="1">
        <button class="btn" data-viewuser="${p.id}" title="Open profile" style="border-color:var(--cyan);color:var(--cyan)">👁️</button>
        ${isMe?'':`<button class="btn" data-deluser="${p.id}" data-dn="${escapeHtml(p.name)}" title="Delete user" style="border-color:var(--red);color:#ffb3b3">🗑️</button>`}
      </div></td>
    </tr>`;
  }).join("");

  return `<div class="card"><h3>👥 Players</h3>
    <div class="crmsearch">
      <input id="usersearch" placeholder="🔍  Search by name, nation, timezone, locale…" value="${escapeHtml(adminUserFilter)}"/>
      <select id="userscope">
        <option value="players" ${scope==="players"?'selected':''}>Players only</option>
        <option value="admins"  ${scope==="admins" ?'selected':''}>Admins only</option>
        <option value="all"     ${scope==="all"    ?'selected':''}>Everyone</option>
      </select>
      <span class="count">${rows.length} of ${DB.profiles.length}</span>
    </div>
    <div class="crmwrap"><table class="crm"><thead>${headRow}</thead><tbody>${body || `<tr><td colspan="9" class="center muted" style="padding:20px">No matches.</td></tr>`}</tbody></table></div>
    <div class="tiny muted" style="margin-top:8px">Click a column header to sort. <b>👁️</b> opens the full audit — every league, every pick, every banter post.</div>
  </div>`;
}

// 🏆 Sortable + searchable leagues table.
function adminLeaguesTable(){
  const filterQ = (adminLeagueFilter||"").toLowerCase().trim();
  let rows = (ALL_LEAGUES.length?ALL_LEAGUES:LEAGUES).slice();
  if(filterQ){
    rows = rows.filter(l=>{
      const creator = (DB.profiles.find(p=>p.id===l.created_by)||{}).name || "";
      const hay = `${l.name||''} ${l.code||''} ${l.currency||''} ${creator}`.toLowerCase();
      return hay.includes(filterQ);
    });
  }
  rows = rows.map(l=>{
    const memCount  = MEMBERS.filter(m=>m.league===l.id).length;
    const paidCount = MEMBERS.filter(m=>m.league===l.id && m.paid).length;
    const pickCount = ALL.pred.filter(p=>p.league===l.id && !p.advance && !p.ko).length;
    const banterCount = ALL.comments.filter(c=>c.league===l.id).length;
    const creator = (DB.profiles.find(p=>p.id===l.created_by)||{}).name || "—";
    const pot = (l.buy_in||0) * memCount;
    return Object.assign({}, l, {memCount, paidCount, pickCount, banterCount, creator, pot,
      created_ts: l.created_at?new Date(l.created_at).getTime():0});
  });
  const [f,d] = adminLeagueSort.split(":");
  const sortField = ({created_at:"created_ts", name:"name", code:"code", members:"memCount", picks:"pickCount", banter:"banterCount", pot:"pot", buyin:"buy_in", creator:"creator"}[f])||"created_ts";
  rows.sort(compareBy(sortField, d));

  const headRow = `<tr>
    ${thSort("leagues","name","League", adminLeagueSort)}
    ${thSort("leagues","code","Invite", adminLeagueSort)}
    ${thSort("leagues","created_at","Created", adminLeagueSort)}
    ${thSort("leagues","creator","Creator", adminLeagueSort)}
    ${thSort("leagues","members","Members", adminLeagueSort)}
    ${thSort("leagues","buyin","Buy-in", adminLeagueSort)}
    ${thSort("leagues","pot","Pot", adminLeagueSort)}

}

// 📜 Build a flat chronological list of every notable event across the pool.
// Each event = {ts, kind, icon, who, msg}. Used by the Activity tab + Overview preview.
function buildActivityEvents(){
  const ev = [];
  // Signups
  DB.profiles.forEach(p=>{ if(p.created_at) ev.push({
    ts:new Date(p.created_at).getTime(), kind:"signup", icon:"🆕",
    who:p.id, msg:`<b>${escapeHtml(p.name)}</b> signed up${p.signup_tz?` from <b>${prettyTZ(p.signup_tz)}</b>`:''}${p.team&&teamById(p.team)?` · supports ${teamById(p.team).flag} ${teamById(p.team).name}`:''}`
  }); });
  // League creations
  (ALL_LEAGUES.length?ALL_LEAGUES:LEAGUES).forEach(l=>{ if(l.created_at){
    const creator = (DB.profiles.find(p=>p.id===l.created_by)||{}).name || "—";
    ev.push({
      ts:new Date(l.created_at).getTime(), kind:"league", icon:"🏆",
      who:l.created_by, msg:`<b>${escapeHtml(creator)}</b> created league <b>${escapeHtml(l.name)}</b> · invite <b>${l.code}</b> · ${money(l.buy_in)} buy-in`
    });
  } });
  // League joins (memberships) — skip if joined_at equals league creation (= creator auto-join)
  MEMBERS.forEach(m=>{ if(m.joined_at){
    const u = DB.profiles.find(p=>p.id===m.user); if(!u || u.is_admin) return;
    const lg = (ALL_LEAGUES.length?ALL_LEAGUES:LEAGUES).find(l=>l.id===m.league); if(!lg) return;
    const jts = new Date(m.joined_at).getTime();
    const cts = lg.created_at?new Date(lg.created_at).getTime():0;
    if(Math.abs(jts-cts)<2000 && m.user===lg.created_by) return; // creator auto-join — skip noise
    ev.push({ts:jts, kind:"join", icon:"🤝", who:m.user, msg:`<b>${escapeHtml(u.name)}</b> joined league <b>${escapeHtml(lg.name)}</b>`});
  } });
  // Picks (created)
  ALL.pred.filter(p=>p.created && !p.advance && !p.ko).forEach(p=>{
    const u = DB.profiles.find(x=>x.id===p.user); if(!u || u.is_admin) return;
    const m = DB.matches.find(x=>x.id===p.match); if(!m) return;
    const lg = (ALL_LEAGUES.length?ALL_LEAGUES:LEAGUES).find(l=>l.id===p.league);
    const h = teamById(m.home), a = teamById(m.away);
    ev.push({ts:new Date(p.created).getTime(), kind:"pick", icon:"⚽",
      who:p.user, msg:`<b>${escapeHtml(u.name)}</b> locked <b>${h?h.flag:'?'} ${p.hp}–${p.ap} ${a?a.flag:'?'}</b>${p.banker?' ⭐':''}${lg?` in <b>${escapeHtml(lg.name)}</b>`:''}`});
  });
  // Banter
  ALL.comments.forEach(c=>{
    const u = DB.profiles.find(x=>x.id===c.user); if(!u || u.is_admin) return;
    const lg = (ALL_LEAGUES.length?ALL_LEAGUES:LEAGUES).find(l=>l.id===c.league);
    ev.push({ts:new Date(c.created).getTime(), kind:"banter", icon:"💬",
      who:c.user, msg:`<b>${escapeHtml(u.name)}</b> in <b>${lg?escapeHtml(lg.name):'a league'}</b>: <span class="muted">"${escapeHtml(c.body.slice(0,80))}${c.body.length>80?'…':''}"</span>`});
  });
  // Likes
  ALL.likes.forEach(l=>{
    const u = DB.profiles.find(x=>x.id===l.user); if(!u || u.is_admin) return;
    const c = ALL.comments.find(x=>x.id===l.comment); if(!c) return;
    const author = DB.profiles.find(p=>p.id===c.user);
    ev.push({ts:new Date(l.created).getTime(), kind:"like", icon:"❤️",
      who:l.user, msg:`<b>${escapeHtml(u.name)}</b> liked <b>${author?escapeHtml(author.name):'someone'}</b>'s banter`});
  });
  // Cards
  ALL.cards.forEach(c=>{
    const from = DB.profiles.find(x=>x.id===c.from);
    const target = DB.profiles.find(x=>x.id===c.target);
    if(!from || !target || from.is_admin) return;
    ev.push({ts:new Date(c.created).getTime(), kind:"card", icon: c.kind==="red"?"🟥":"🟨",
      who:c.from, msg:`<b>${escapeHtml(from.name)}</b> booked <b>${escapeHtml(target.name)}</b> with a ${c.kind} card`});
  });
  // Sort newest first
  return ev.sort((a,b)=>b.ts-a.ts);
}
function renderActivityRow(e){
  return `<div class="actrow"><span class="actic">${e.icon}</span>
    <span class="actwhat">${e.msg}</span>
    <span class="actwhen" title="${e.ts?fmtKick(new Date(e.ts).toISOString()):''}">${relativeTime(new Date(e.ts).toISOString())}</span></div>`;
}
function adminActivityView(){
  let ev = buildActivityEvents();
  const filt = adminActivityFilter;
  const KINDS = [["all","All"],["signup","🆕 Signups"],["league","🏆 Leagues"],["join","🤝 Joins"],["pick","⚽ Picks"],["banter","💬 Banter"],["like","❤️ Likes"],["card","🟨 Cards"]];
  if(filt!=="all") ev = ev.filter(x=>x.kind===filt);
  const trail = ev.slice(0, 400); // cap to avoid huge DOM
  return `<div class="card"><h3>📜 Activity log</h3>
    <div class="small muted">Every notable event across every league, newest first. Click a tag to filter.</div>
    <div class="actfilters">${KINDS.map(([v,l])=>`<button class="${filt===v?'on':''}" data-actfilter="${v}">${l}</button>`).join("")}</div>
    <div class="tiny muted" style="margin-bottom:6px">${ev.length} event${ev.length===1?'':'s'} ${filt==="all"?'':`· filter: ${filt}`}${ev.length>trail.length?` · showing newest ${trail.length}`:''}</div>
    ${trail.length
      ? `<div class="actfeed">${trail.map(renderActivityRow).join("")}</div>`
      : `<div class="empty"><div class="e">🪺</div>Nothing here yet.</div>`}
  </div>`;
}

// 🔑 Admin: reset a player's password. Talks to the /api/admin-reset-password
// serverless function (which holds the Supabase service-role key — never in
// the browser). Generates a friendly memorable password by default so the
// admin can WhatsApp it without typing nightmares.
const TEMP_PW_ADJ = ['quick','golden','silver','clever','silent','brave','swift','noble','royal','lucky','sunny','tiger','sharp','witty','jolly'];
const TEMP_PW_NOUN = ['eagle','panda','river','falcon','dragon','tiger','wolf','lion','bear','fox','otter','hawk','heron','badger','lynx'];
function generateTempPassword(){
  const a=TEMP_PW_ADJ[Math.floor(Math.random()*TEMP_PW_ADJ.length)];
  const n=TEMP_PW_NOUN[Math.floor(Math.random()*TEMP_PW_NOUN.length)];
  const num=Math.floor(Math.random()*9000)+1000;
  return `${a}-${n}-${num}`;
}
function openResetPasswordModal(uid, name){
  const root=$("#modal-root");
  const generated = generateTempPassword();
  root.innerHTML=`<div class="modal-bg"><div class="modal">
    <div class="mhead"><b>🔑 Reset password for ${escapeHtml(name)}</b><button class="x" data-close>×</button></div>
    <div class="mbody">
      <div class="small muted">Use this when a friend has forgotten their password. The new one replaces theirs immediately — their old password stops working. Send them the new one via WhatsApp / iMessage and ask them to change it once they're in.</div>
      <label class="fld" style="margin-top:14px">New password</label>
      <div class="row" style="gap:6px">
        <input id="newpw" value="${escapeHtml(generated)}" style="font-family:monospace;letter-spacing:1px;font-size:16px;flex:1"/>
        <button class="btn" id="regen" style="white-space:nowrap" type="button">🎲 New one</button>
      </div>
      <div class="tiny muted" style="margin-top:4px">Min 6 characters. Pre-filled with a friendly random word + number — easier to type than gibberish.</div>
      <button class="btn primary block" id="dorpw" style="margin-top:14px">🔑 Reset password</button>
    </div></div></div>`;
  const close=()=>{ root.innerHTML=""; };
  $("[data-close]",root).onclick=close;
  $(".modal-bg",root).onclick=e=>{ if(e.target.classList.contains("modal-bg")) close(); };
  $("#regen",root).onclick=()=>{ $("#newpw",root).value=generateTempPassword(); };
  $("#dorpw",root).onclick=async()=>{
    const np=$("#newpw",root).value.trim();
    if(np.length<6){ toast("Password must be 6+ characters"); return; }
    const btn=$("#dorpw",root); btn.disabled=true; btn.textContent="Resetting…";
    try{
      if(MODE!=="live" || !supa){
        toast("Password reset needs live mode (Supabase) — not available in demo");
        btn.disabled=false; btn.textContent="🔑 Reset password"; return;
      }
      // Pull the admin's session JWT. Try a few fallbacks because Supabase sometimes
      // returns null on the very first getSession() right after sign-in, even when a
      // valid session exists in localStorage.
      let token = null;
      try{
        const g = await supa.auth.getSession();
        token = g && g.data && g.data.session && g.data.session.access_token;
      }catch(e){ console.warn("getSession failed", e); }
      if(!token){
        // Try a refresh — picks up sessions cached in localStorage even when getSession returns null.
        try{
          const r = await supa.auth.refreshSession();
          token = r && r.data && r.data.session && r.data.session.access_token;
        }catch(e){ console.warn("refreshSession failed", e); }
      }
      if(!token){
        // Last resort: getUser triggers an internal session check; if it works we have a session somewhere.
        try{
          const u = await supa.auth.getUser();
          if(u && u.data && u.data.user){
            const g2 = await supa.auth.getSession();
            token = g2 && g2.data && g2.data.session && g2.data.session.access_token;
          }
        }catch(e){ console.warn("getUser fallback failed", e); }
      }
      if(!token){
        console.error("No JWT — supa client has no live session");
        toast("Admin session expired — sign out + sign back in at /admin, then try again");
        btn.disabled=false; btn.textContent="🔑 Reset password"; return;
      }
      const r=await fetch("/api/admin-reset-password", {
        method:"POST",
        headers:{ "Authorization":"Bearer "+token, "Content-Type":"application/json" },
        body: JSON.stringify({ targetUid: uid, newPassword: np })
      });
      if(r.ok){
        close();
        showResetSuccessModal(name, np);
      } else {
        let errMsg = r.status + " " + r.statusText;
        try{ const j=await r.json(); if(j && j.error) errMsg=j.error; }catch(e){}
        console.error("Reset failed", r.status, errMsg);
        toast("Reset failed: "+errMsg);
        btn.disabled=false; btn.textContent="🔑 Reset password";
      }
    } catch(e){
      console.error(e);
      toast("Network error: "+e.message);
      btn.disabled=false; btn.textContent="🔑 Reset password";
    }
  };
  setTimeout(()=>{ const i=$("#newpw",root); if(i){ i.focus(); i.select(); } }, 60);
}
function showResetSuccessModal(name, password){
  const root=$("#modal-root");
  root.innerHTML=`<div class="modal-bg"><div class="modal">
    <div class="mhead"><b>✅ Password reset</b><button class="x" data-close>×</button></div>
    <div class="mbody center">
      <div style="font-size:48px">🔑</div>
      <div style="font-family:'Fredoka';font-size:18px;margin-top:6px">Send this to <b>${escapeHtml(name)}</b></div>
      <div class="small muted" style="margin-top:4px">Visible just this once — copy it before closing.</div>

      <button class="btn primary block" id="copynpw" style="margin-top:10px">📋 Copy password</button>
      <div class="tiny muted" style="margin-top:8px">Tell them to log in at the player login with their existing username and this new password. They can change it later from their profile.</div>
    </div></div></div>`;

  $("[data-close]",root).onclick=close;
  $(".modal-bg",root).onclick=e=>{ if(e.target.classList.contains("modal-bg")) close(); };
  $("#copynpw",root).onclick=()=>{ copyText(password); toast("Password copied 📋"); };
}

      <div class="pill" style="background:var(--card2);text-align:center;padding:10px"><div class="tiny muted">🔁 Re-picks used</div><div style="font-family:'Fredoka';font-size:20px">${allRepicks.length}/${REPICK_MAX}</div></div>
    </div>
    <div class="tiny muted" style="margin-top:10px">
      Last banter: ${lastBanter?relativeTime(lastBanter):'—'} ·
      Last like: ${lastLike?relativeTime(lastLike):'—'} ·
      Last bracket pick: ${lastBracket?relativeTime(lastBracket):'—'}
    </div>
  </div>`;

  // Per-league breakdown
  if(!userLeagues.length){
    html += `<div class="card center"><div class="empty"><div class="e">🏆</div>Not in any league yet.</div></div>`;
  } else {
    html += `<div class="card"><h3>🏆 Leagues (${userLeagues.length})</h3>
      <div class="small muted">Per-league stats. Click <b>👁️</b> to drill into a league, <b>🟥</b> to remove the user from just that one.</div>`;
    userLeagues.forEach(lg=>{
      // Compute per-league stats by temporarily scoping
      const lid = lg.id;
      const lp = ALL.pred.filter(x=>x.user===uid && x.league===lid && !x.advance && !x.ko);
      const lb = ALL.pred.filter(x=>x.user===uid && x.league===lid && x.banker).length;
      const ladv = ALL.pred.filter(x=>x.user===uid && x.league===lid && x.advance).length;
      const lko = ALL.pred.filter(x=>x.user===uid && x.league===lid && x.ko).length;
      const lbr = (ALL.bracket||[]).filter(x=>x.user===uid && x.league===lid).length;
      const lprops = ALL.pans.filter(x=>x.user===uid && x.league===lid).length;
      const lcmts = ALL.comments.filter(c=>c.user===uid && c.league===lid).length;
      const paid = memberPaid(uid, lid);
      // Compute their rank + points within this league using the existing scoreFor() and leagueMembers()
      // We need to temporarily set LG to compute scoreFor in this league's scope.
      const savedLG = LG, savedDB = {pred:DB.predictions, pans:DB.propAnswers, rep:DB.repicks, br:DB.bracket, cm:DB.comments, cd:DB.cards, lk:DB.likes};
      LG = lid; scopeLeague();
      const lbBoard = leagueMembers(lid).map(m=>({id:m.id, pts:scoreFor(m.id).pts})).sort((a,b)=>b.pts-a.pts);
      const myRow = lbBoard.find(x=>x.id===uid);
      const myPts = myRow ? myRow.pts : 0;
      const myRk  = myRow ? lbBoard.findIndex(x=>x.id===uid)+1 : 0;
      // Restore
      LG = savedLG;
      DB.predictions=savedDB.pred; DB.propAnswers=savedDB.pans; DB.repicks=savedDB.rep; DB.bracket=savedDB.br;
      DB.comments=savedDB.cm; DB.cards=savedDB.cd; DB.likes=savedDB.lk;

      html += `<div class="card" style="margin:8px 0">
        <div class="row" style="gap:10px;align-items:center;flex-wrap:wrap">
          <div style="flex:1;min-width:160px">
            <div style="font-family:'Fredoka';font-weight:700;font-size:16px">🏆 ${escapeHtml(lg.name)} <span class="tiny muted" style="font-weight:400">· invite ${lg.code}</span></div>
            <div class="small muted">
              <b style="color:var(--lime)">${myPts} pts</b> · rank ${myRk?`#${myRk}/${lbBoard.length}`:'—'} ·
              ${lp.length} picks (${lb} ⭐ banker) · ${ladv} group · ${lko} KO · ${lbr} bracket · ${lprops} extras · ${lcmts} banter ·
              ${paid?'<span style="color:var(--green)">paid ✓</span>':'<span style="color:var(--gold)">unpaid</span>'}
            </div>
          </div>
          <div class="row" style="gap:6px;flex-wrap:wrap">
            <button class="btn" data-viewleague="${lid}" style="padding:5px 10px;border-color:var(--cyan);color:var(--cyan)">👁️ League</button>
            ${isMe?'':`<button class="btn" data-kick="${uid}" data-klid="${lid}" data-kn="${escapeHtml(p.name)}" style="padding:5px 10px;border-color:var(--red);color:#ffb3b3">🟥 Remove</button>`}
          </div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // Full pick history (grouped by league, sorted by kickoff)
  if(allPicks.length){
    html += `<div class="card"><h3>⚽ Every match pick (${allPicks.length})</h3>
      <div class="small muted">Sorted by kickoff. ⭐ = Banker. ✓/✗ once the match has finished.</div>`;
    userLeagues.forEach(lg=>{
      const lid = lg.id;
      const picks = ALL.pred.filter(x=>x.user===uid && x.league===lid && !x.advance && !x.ko)
        .map(pr=>({pr, m:DB.matches.find(x=>x.id===pr.match)})).filter(x=>x.m)
        .sort((a,b)=> new Date(a.m.kickoff)-new Date(b.m.kickoff));
      if(!picks.length) return;
      html += `<div style="margin-top:10px"><div class="tiny" style="color:var(--gold);font-family:Fredoka;font-weight:700;letter-spacing:1px">🏆 ${escapeHtml(lg.name).toUpperCase()}</div>`;
      picks.forEach(({pr, m})=>{
        const h = teamById(m.home), a = teamById(m.away);
        const finished = m.status==="finished";
        let verdict = '';
        if(finished){
          const exact = (pr.hp===m.hs && pr.ap===m.as);
          const resHome = pr.hp>pr.ap?'h':(pr.hp<pr.ap?'a':'d');
          const resAct  = m.hs>m.as?'h':(m.hs<m.as?'a':'d');
          if(exact) verdict = `<span style="color:var(--lime)">✓ exact</span>`;
          else if(resHome===resAct) verdict = `<span style="color:var(--cyan)">≈ right result</span>`;
          else verdict = `<span style="color:var(--muted)">✗ off</span>`;
        }
        html += `<div class="small" style="display:flex;gap:8px;align-items:center;padding:5px 10px;margin-top:3px;background:var(--bg);border:1px solid var(--line);border-radius:8px">
          <span class="tiny muted" style="min-width:84px">${m.grp?`Grp ${m.grp} MD${m.md}`:m.stage}</span>
          <span style="flex:1">${h?h.flag+' '+h.name:'?'} <b>${pr.hp}–${pr.ap}</b> ${a?a.name+' '+a.flag:'?'}${finished?` <span class="muted">(FT ${m.hs}–${m.as})</span>`:''}</span>
          ${pr.banker?'<span title="Banker" style="color:var(--gold)">⭐</span>':''}
          ${verdict}
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }

  // Banter posts (full text)
  if(allBanter.length){
    html += `<div class="card"><h3>💬 Banter posts (${allBanter.length})</h3>`;
    allBanter.slice().sort((a,b)=>new Date(b.created)-new Date(a.created)).slice(0,30).forEach(c=>{
      const lg = userLeagues.find(l=>l.id===c.league);
      const likes = ALL.likes.filter(l=>l.comment===c.id).length;
      html += `<div class="small" style="padding:7px 10px;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px">
        <div class="tiny muted">${lg?'🏆 '+escapeHtml(lg.name):''} · ${relativeTime(c.created)} · ❤️ ${likes}</div>
        <div style="margin-top:3px">${escapeHtml(c.body)}</div>
      </div>`;
    });
    if(allBanter.length>30) html += `<div class="tiny muted center" style="margin-top:6px">… and ${allBanter.length-30} more older posts.</div>`;
    html += `</div>`;
  }

  return html;
}

/* ============================================================================
   🎛️  RENDER ROOT + EVENT WIRING
   ============================================================================ */
function render(){
  // 🎩 Admin mode — no leagues, no picks, no player UI. Just the commissioner dashboard.
  // Admin sessions skip the leagueGate entirely (admins aren't in any league by design).
  if(ME && ME.is_admin){
    loadAdv();
    VIEW = "admin";              // admin has no other tabs
    ADMIN_UNLOCKED = true;       // signed-in admin account is implicitly unlocked
    const body = viewAdmin();
    let banner = MODE==="demo" ? `<div class="banner demo">🎮 <b>Demo mode</b> — admin sandbox.</div>` : "";
    $("#app").innerHTML = adminHeader()+`<div class="app view-admin">${banner}${body}</div>`;
    wire();
    return;
  }
  // not in any league yet → show the create/join gate (no header/nav)
  if(ME && (!LG || !curLeague())){ $("#app").innerHTML = leagueGate(); wireGate(); return; }
  loadAdv();
  if(VIEW==="admin" && !ADMIN_UNLOCKED) VIEW="picks";
  const views={picks:viewPicks,bracket:viewBracket,props:viewProps,board:viewBoard,banter:viewBanter,pool:viewPool,admin:viewAdmin};
  const body=(views[VIEW]||viewPicks)();
  let banner = MODE==="demo" ? `<div class="banner demo">🎮 <b>Demo mode</b> — you're playing with sample friends & data so you can feel the game. Add your Supabase keys (see SETUP.md) to go live with real logins for your crew.</div>` : "";
  $("#app").innerHTML = header()+`<div class="app view-${VIEW}">${banner}${body}</div>`+nav();
  wire();
  // 📬 entrance mail popup — slight delay so the page paints first (self-guards: once per visit)
  setTimeout(maybeMailPopup, 700);
  if(WANT_ADMIN && !ADMIN_UNLOCKED){ WANT_ADMIN=false; promptAdmin(); }
}

// 🎩 Admin's own top bar — distinct from the player header. No league chip, no points,
// no tabs. Just identity + sign-out, because admin only has one view: the dashboard.
// The Logout button is the big obvious one — single click, no confirm modal needed
// because admin work is server-side and signing out doesn't lose anything.
function adminHeader(){
  return `<header class="top adminhdr"><div class="brandrow"><div class="topbar">
    <button class="tb-brand" data-home title="Back to Overview">${ADMIN_EMOJI} <b>admin</b></button>
    <div class="tb-meta">
      <span class="badge-admin">ADMIN MODE</span>
      <button class="lockbtn" data-rules title="Pool rules">ℹ️</button>
      <button class="btn" data-adminlogout style="padding:7px 14px;border-color:var(--red);color:#ffb3b3;font-weight:700">🚪 Logout</button>
    </div>
  </div></div></header>`;
}

function wire(){
  // 👁️ Click any avatar / row that's tagged data-vp → open the player card modal
  // (big avatar + their stats in this league). Skip clicks that came from a button
  // inside the row by checking for data-stop on the click target chain.
  $$("[data-vp]").forEach(el=>el.onclick=e=>{
    if(e.target.closest("[data-stop]")) return;
    openPlayerCard(el.dataset.vp);
  });
  // 🏠 Click the brand/logo in the top bar → back to dashboard.
  // For players this is the Picks dashboard; for the admin account it's the Overview tab.
  $$("[data-home]").forEach(b=>b.onclick=()=>{
    if(ME && ME.is_admin){ adminTab="overview"; adminFocusUser=null; adminFocusLeague=null; }
    else { VIEW="picks"; }
    render(); window.scrollTo({top:0, behavior:"smooth"});
  });
  // nav
  $$("[data-tab]").forEach(b=>b.onclick=()=>{
    const tab=b.dataset.tab;
    VIEW=tab; render();
    // 🖱️ For the Picks tab, scroll past the dashboard cards straight to the picks section.
    // For every other tab, jump to the top of the page.
    if(tab==="picks"){
      const target=document.getElementById("pickssec");
      if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
      else window.scrollTo(0,0);
    } else {
      window.scrollTo(0,0);
    }
  });
  // hero leaderboard → jump to the right Board sub-tab
  $$("[data-goboard]").forEach(b=>b.onclick=()=>{ boardTab=b.dataset.goboard; VIEW="board"; render(); window.scrollTo(0,0); });
  // admin lock / unlock
  // Admin access used to be a 🔒 button in the top bar — now it's strictly the /admin URL.
  // (Handler kept for safety in case any older view still renders a [data-adminlock] element.)
  const lk=$("[data-adminlock]"); if(lk) lk.onclick=()=>{ if(ADMIN_UNLOCKED){VIEW="admin";render();window.scrollTo(0,0);} else promptAdmin(); };
  const dl=$("[data-dolock]"); if(dl) dl.onclick=async()=>{ await adminLock(); toast("Out of admin mode 🚪"); VIEW="picks"; render(); };
  // 🚪 One-click admin logout. No confirm modal — admin work is server-side and signing out
  // doesn't risk losing anything. Found in both the top bar and the admin panel card.
  $$("[data-adminlogout]").forEach(b=>b.onclick=async()=>{ toast("Signed out of admin 🚪"); await adminLock(); });
  // 🚪 Sign-out: when admin is signed in, this signs out the admin account (separate identity);
  // when a player is signed in, this signs out the player. Either way → back to login screen.
  const so=$("[data-signout]"); if(so) so.onclick=()=>{
    const adminMode = !!(ME && ME.is_admin);
    const title = adminMode ? "Sign out of admin?" : "Sign out of THE MASK?";
    const sub   = adminMode
      ? "Drops the admin session and returns you to the player sign-in. Your admin work is saved on the server."
      : "You'll be returned to the login screen and need to re-enter your name to come back. Your picks and league memberships stay safe on the server.";
    const yesLabel = adminMode ? "Sign out of admin" : "Sign me out";
    confirmModal(`<div class="center"><div style="font-size:36px">${adminMode?'🎩':'👋'}</div><div style="font-family:'Fredoka';font-size:18px">${title}</div><div class="small muted" style="margin-top:6px">${sub}</div></div>`,
      ()=>{ if(adminMode) adminLock(); else logout(); }, yesLabel);
  };
  // 🟥 Kick member from a league (admin only). Buttons in the drilled-in league detail view
  // carry an explicit data-klid; otherwise the current league (LG) is used.
  $$("[data-kick]").forEach(b=>b.onclick=()=>{ const uid=b.dataset.kick, nm=b.dataset.kn||"this player", lid=b.dataset.klid||null;
    const lgName = lid ? (((ALL_LEAGUES||[]).find(l=>l.id===lid)||(LEAGUES||[]).find(l=>l.id===lid)||{}).name || 'this league') : (curLeague()?curLeague().name:'this league');
    confirmModal(`<div class="center"><div style="font-size:36px">🟥</div><div style="font-family:'Fredoka';font-size:18px">Send off ${nm} from "${escapeHtml(lgName)}"?</div><div class="small muted" style="margin-top:6px">They'll be removed from this league and all their picks, props, banter, likes and cards here get wiped. Their account stays intact — they can rejoin via the invite code if you want.</div></div>`, async()=>{ await kickMember(uid, lid); }, "Yes, send them off 🟥"); });
  // 🗑️ Super-admin: delete an entire league
  // 🛠️ Super-admin: drill into one league or one user
  $$("[data-viewleague]").forEach(b=>b.onclick=()=>{ adminFocusLeague=b.dataset.viewleague; adminTab="leagues"; adminFocusUser=null; render(); window.scrollTo(0,0); });
  const back=$("[data-backleagues]"); if(back) back.onclick=()=>{ adminFocusLeague=null; render(); window.scrollTo(0,0); };
  $$("[data-viewuser]").forEach(b=>b.onclick=()=>{ adminFocusUser=b.dataset.viewuser; render(); window.scrollTo(0,0); });
  const backu=$("[data-backusers]"); if(backu) backu.onclick=()=>{ adminFocusUser=null; render(); window.scrollTo(0,0); };
  // 🔑 Admin password reset (option 1 — friend forgot password)
  $$("[data-resetpw]").forEach(b=>b.onclick=()=>openResetPasswordModal(b.dataset.resetpw, b.dataset.resetnm||"this user"));
  // 🖱️ Whole-row clicks open the league / user detail (action cells stop propagation).
  $$("[data-rowleague]").forEach(tr=>tr.onclick=e=>{ if(e.target.closest("[data-stop]")) return; adminFocusLeague=tr.dataset.rowleague; adminTab="leagues"; adminFocusUser=null; render(); window.scrollTo(0,0); });
  $$("[data-rowuser]").forEach(tr=>tr.onclick=e=>{ if(e.target.closest("[data-stop]")) return; adminFocusUser=tr.dataset.rowuser; render(); window.scrollTo(0,0); });
  // 📨 Native share button — uses navigator.share where available (iOS/Android/some desktops),
  // otherwise falls back to copying the invite link to the clipboard.
  $$("[data-sharelg]").forEach(b=>b.onclick=async()=>{
    const code = b.dataset.sharelg, nm = b.dataset.sharenm || "our league";
    const url = inviteLink(code);
    const text = `Join ${nm} on THE MASK — World Cup '26 pool. Code: ${code}\n${url}`;
    if(navigator.share){
      try{ await navigator.share({title:`Join ${nm}`, text, url}); }
      catch(e){ /* user dismissed share sheet — silent */ }
    } else { copyText(text); toast("Share sheet not available — invite copied 📋"); }
  });
  // 📊 CRM sortable headers + search + activity filter wires
  $$("[data-sort-users]").forEach(h=>h.onclick=()=>{ adminToggleSort(adminUserSort,v=>adminUserSort=v,h.dataset.sortUsers); render(); });
  $$("[data-sort-leagues]").forEach(h=>h.onclick=()=>{ adminToggleSort(adminLeagueSort,v=>adminLeagueSort=v,h.dataset.sortLeagues); render(); });
  const us=$("#usersearch"); if(us){ us.oninput=()=>{ adminUserFilter=us.value; clearTimeout(window._usrch); window._usrch=setTimeout(()=>{ render(); setTimeout(()=>{const x=$("#usersearch");if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length);}}, 0); }, 200); }; }
  const ls=$("#leaguesearch"); if(ls){ ls.oninput=()=>{ adminLeagueFilter=ls.value; clearTimeout(window._lsrch); window._lsrch=setTimeout(()=>{ render(); setTimeout(()=>{const x=$("#leaguesearch");if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length);}}, 0); }, 200); }; }
  const sc=$("#userscope"); if(sc) sc.onchange=()=>{ adminUserScope=sc.value; render(); };
  $$("[data-actfilter]").forEach(b=>b.onclick=()=>{ adminActivityFilter=b.dataset.actfilter; render(); });
  $$("[data-delleague]").forEach(b=>b.onclick=()=>{ const lid=b.dataset.delleague, nm=b.dataset.dn||"this league";
    confirmModal(`<div class="center"><div style="font-size:36px">🗑️🏆</div><div style="font-family:'Fredoka';font-size:18px">Delete league "${nm}"?</div><div class="small muted" style="margin-top:6px">This wipes every prediction, prop answer, bracket pick, comment, like and card scoped to this league — instantly, for every member. The user accounts themselves stay. <b>This cannot be undone.</b></div></div>`, async()=>{ await adminDeleteLeague(lid); }, "Yes, delete the league 🗑️"); });
  // 🗑️ Super-admin: delete a user entirely
  $$("[data-deluser]").forEach(b=>b.onclick=()=>{ const uid=b.dataset.deluser, nm=b.dataset.dn||"this user";
    confirmModal(`<div class="center"><div style="font-size:36px">🗑️👤</div><div style="font-family:'Fredoka';font-size:18px">Delete user "${nm}"?</div><div class="small muted" style="margin-top:6px">Removes them from every league + wipes every pick, prop, banter post, like and card they've ever made. Their Supabase login row stays (we don't have permission to delete it client-side). <b>This cannot be undone.</b></div></div>`, async()=>{ await adminDeleteUser(uid); }, "Yes, delete the user 🗑️"); });
  // sound + profile
  const mt=$("[data-mute]"); if(mt) mt.onclick=()=>{ toggleMute(); if(!MUTED)horn(); render(); };
  const pf=$("[data-profile]"); if(pf) pf.onclick=openProfile;
  // ✉️🔔 inbox + notification bell (header) — badges refresh in place after each render
  const ib=$("[data-inbox]");  if(ib) ib.onclick=openInbox;
  const nb=$("[data-notifs]"); if(nb) nb.onclick=openNotifs;
  updateNotifBadges();
  // picks filters
  $$("[data-pf]").forEach(b=>b.onclick=()=>{pickFilter=b.dataset.pf;render();});
  // score inputs → live into the draft (no save yet, no re-render so the cursor stays)
  $$("[data-sc]").forEach(inp=>inp.oninput=()=>{ const id=inp.dataset.m,d=draft(id); const v=inp.value===""?null:clamp(parseInt(inp.value)||0,0,30); if(inp.dataset.sc==="home")d.hp=v; else d.ap=v; });
  // banker toggle (draft-only) + lock-in
  $$("[data-bank]").forEach(b=>b.onclick=()=>{ const id=b.dataset.bank,d=draft(id); d.banker=!d.banker; render(); });
  $$("[data-lock]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.lock;
    const hi=$(`[data-sc="home"][data-m="${id}"]`),ai=$(`[data-sc="away"][data-m="${id}"]`);
    const hp=hi.value===""?null:clamp(parseInt(hi.value)||0,0,30);
    const ap=ai.value===""?null:clamp(parseInt(ai.value)||0,0,30);
    if(hp==null||ap==null){toast("Enter both scores ⚽");return;}
    const d=draft(id), m=DB.matches.find(x=>x.id===id), useBank=d.banker&&canBankMatch(m);
    // Quick-save model: no confirm modal — you can edit again until the round deadline.
    await lockPick(id,hp,ap,useBank); toast("💾 Saved · editable until the round locks"); render();
  });
  // 🔓 Unlock a saved pick so you can edit it — only allowed before the round deadline.
  $$("[data-unlock]").forEach(b=>b.onclick=async()=>{ await unlockPick(b.dataset.unlock); render(); });
  // half-time re-pick (in-play, costs points)
  $$("[data-repick]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.repick;
    const hi=$(`[data-sc="home"][data-m="${id}"]`),ai=$(`[data-sc="away"][data-m="${id}"]`);
    const hp=hi.value===""?null:clamp(parseInt(hi.value)||0,0,30);
    const ap=ai.value===""?null:clamp(parseInt(ai.value)||0,0,30);
    if(hp==null||ap==null){toast("Enter both scores ⚽");return;}
    confirmModal(`<div class="center"><div class="big2">${hp}–${ap}</div><div class="small" style="margin-top:6px;color:var(--gold)">Half-time re-pick · costs ${REPICK_COST} points</div><div class="small muted" style="margin-top:6px">${Math.max(0,repicksLeft(ME.id)-1)} re-picks left after this.</div></div>`,
      async()=>{ await saveRepick(id,hp,ap); celebrate("RE-PICK!"); render(); }, `Change it (−${REPICK_COST} pts)`);
  });
  // advance picks (one-shot)
  $$("[data-adv]").forEach(b=>b.onclick=async()=>{
    const g=b.dataset.advgrp, team=b.dataset.adv;
    const mine=DB.predictions.filter(p=>p.user===ME.id&&p.advance&&p.grp===g).map(p=>p.team);
    if(mine.includes(team)||mine.length>=2) return;
    await saveAdvance(g, mine.length, team);
    const t=teamById(team); party(); toast(`${t.flag} ${t.name} — through to the knockouts! ⬆️`); render();
  });
  $$("[data-grp]").forEach(b=>b.onclick=()=>{grpSel=b.dataset.grp;render();});
  // 🏆 bracket — tap a team in a tie to advance them (tap again to undo)
  $$("[data-bpick]").forEach(b=>b.onclick=async()=>{ const [tie,team]=b.dataset.bpick.split("|");
    await pickBracketWinner(tie, team); render();
  });
  // knockout run picks (legacy — still wired but no longer reachable from the bracket view)
  $$("[data-ko]").forEach(b=>b.onclick=()=>openTeamPicker(t=>{saveKO(b.dataset.ko,t.id).then(render);}));
  $$("[data-koadd]").forEach(b=>b.onclick=()=>openTeamPicker(t=>{adminAddKO(b.dataset.koadd,t.id).then(render);}));
  $$("[data-koremove]").forEach(b=>b.onclick=async()=>{const [st,id]=b.dataset.koremove.split("|");await adminRemKO(st,id);render();});
  // props (draft → lock)
  $$("[data-propopt]").forEach(b=>b.onclick=()=>{ pdraft(b.dataset.prop).answer=b.dataset.propopt; render(); });
  $$("[data-teamprop]").forEach(b=>b.onclick=()=>openTeamPicker(t=>{ pdraft(b.dataset.teamprop).answer=t.id; render(); }));
  $$("[data-plock]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.plock, d=pdraft(id);
    if(d.answer==null){toast("Choose an answer first ⚽");return;}
    const pr=DB.props.find(x=>x.id===id);

function openConvo(uid){
  const p=profileById(uid); const root=$("#modal-root");
  if(!p||!root||!ME||uid===ME.id) return;
  markConvoRead(uid);
  const thread=()=>{ const ms=convoMsgs(uid);
    return ms.length?ms.map(m=>`<div class="dm-bub ${m.from===ME.id?'dm-mine':'dm-theirs'}">${escapeHtml(m.body)}<span class="dm-t">${timeAgo(m.created)}${m.from===ME.id&&m.read?' · seen ✓':''}</span></div>`).join("")
      :`<div class="empty" style="padding:18px"><div class="e">🦗</div>No messages yet — break the ice.</div>`; };
  root.innerHTML=`<div class="modal-bg"><div class="modal">
    <div class="mhead"><b style="display:flex;align-items:center;gap:8px"><button class="x" data-back title="All conversations" style="font-size:18px">←</button><span class="avatar" style="width:28px;height:28px;font-size:14px">${avatarInner(p)}</span>${escapeHtml(p.name)}</b><button class="x" data-close>×</button></div>
    <div class="mbody">
      <div class="dm-thread" id="dmthread">${thread()}</div>
      <div class="dmrow"><input id="dmtext" maxlength="500" placeholder="Message ${escapeHtml(p.name)}…"/><button class="btn primary" id="dmsend">Send</button></div>
      <div class="tiny muted" style="margin-top:6px">Only you and ${escapeHtml(p.name)} can see this — not even the admin. 🤫</div>
    </div></div></div>`;
  const close=()=>{ root.innerHTML=""; _refreshOpenConvo=null; };
  $("[data-close]",root).onclick=close;
  $("[data-back]",root).onclick=()=>openInbox();
  $(".modal-bg",root).onclick=e=>{ if(e.target.classList.contains("modal-bg")) close(); };
  const box=$("#dmthread",root); const scrollDown=()=>{ box.scrollTop=box.scrollHeight; }; scrollDown();
  const inp=$("#dmtext",root);
  const send=async()=>{ const v=inp.value; if(!(v||"").trim()) return; inp.value="";
    if(await sendMessage(uid,v)){ box.innerHTML=thread(); scrollDown(); } inp.focus(); };
  $("#dmsend",root).onclick=send;
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); send(); } };
  inp.focus();
  // 🔄 called by the 25s poll — re-draws the thread in place so replies just appear
  _refreshOpenConvo=()=>{ if(!document.getElementById("dmthread")){ _refreshOpenConvo=null; return; }
    markConvoRead(uid);
    const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<60;
    box.innerHTML=thread(); if(atBottom) scrollDown(); };
}

function readImageFile(file, cb){
  if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{
    const sz=160, c=document.createElement("canvas"); c.width=sz; c.height=sz;
    const x=c.getContext("2d"); const r=Math.max(sz/img.width,sz/img.height), w=img.width*r, h=img.height*r;
    x.drawImage(img,(sz-w)/2,(sz-h)/2,w,h);
    cb(c.toDataURL("image/jpeg",0.82)); }; img.onerror=()=>toast("Couldn't read that image"); img.src=fr.result; };
  fr.readAsDataURL(file);
}

  // Once any match has been finalised, the pick is frozen for the tournament.
  const anyMatchDone = (DB.matches||[]).some(m=>m.status==="finished");
  const locked = !!ME.team && anyMatchDone;
  const draw=()=>{
    const ft=pendTeam?teamById(pendTeam):null;
    const shortId = (ME.id||"").length>10 ? (ME.id.slice(0,4)+"…"+ME.id.slice(-4)) : (ME.id||"—");
    // ── Account block: identity + mode + leagues ──

      <div class="card" style="margin:0 0 10px;padding:10px 12px;text-align:left">
        <div class="tiny muted" style="letter-spacing:1px">🪪 ACCOUNT</div>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin-top:6px">

          <div class="muted">Login type</div><div>${MODE==="live"?"Name-only (anonymous) — <b>no email needed</b>":"Demo mode (local browser only)"}</div>
