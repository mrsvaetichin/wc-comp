<style>
  /* ============================================================
     THE MASK — World Cup 2026 friends' prediction pool
     Playful / meme-y theme. Mobile-first, works on desktop too.
     ============================================================ */
  :root{
    --bg:#0a1a2e;          /* deep nordic navy night */
    --bg2:#0e2742;
    --card:#13314f;
    --card2:#1b4068;
    --line:#2b557f;
    --ink:#f3f8ff;
    --muted:#9fc1e0;
    --pink:#0b6fb3;        /* 🇸🇪 SWEDISH BLUE (primary accent) */
    --lime:#c6ff3d;
    --cyan:#5cc8ff;        /* light blue */
    --gold:#ffd02e;        /* 🇸🇪 SWEDISH YELLOW */
    --purple:#073e76;      /* deep blue */
    --green:#3ddc84;
    --red:#ff5c5c;
    --radius:20px;
    --shadow:0 12px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(11,111,179,.38), transparent 60%),
      radial-gradient(1000px 500px at 110% 0%, rgba(255,208,46,.16), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    background-attachment:fixed;
    color:var(--ink);
    min-height:100vh;
    font-size:17px;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Fredoka',sans-serif;}
  .app{max-width:540px;margin:0 auto;padding:0 14px 120px;position:relative;z-index:1}  /* stays ABOVE #gyokbg so the background image doesn't tint our content */
  a{color:var(--cyan)}
  button{font-family:inherit;cursor:pointer;border:none}

  /* ---------- header ---------- */
  header.top{
    position:sticky;top:0;z-index:30;
    margin:0 -14px 8px;padding:12px 16px 10px;
    background:linear-gradient(180deg, rgba(12,10,31,.96), rgba(12,10,31,.78));
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  /* ----- unified top bar: stacks on mobile, one row on desktop ----- */
  .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tb-brand{display:flex;align-items:center;gap:7px;font-family:'Fredoka';font-weight:700;font-size:20px;letter-spacing:.5px;cursor:pointer;transition:filter .15s, transform .08s;background:none;border:none;padding:0;color:inherit;font:inherit}
  .tb-brand:hover{filter:brightness(1.12)}
  .tb-brand:active{transform:scale(.98)}
  .tb-brand .ball{font-size:22px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
  .tb-meta{margin-left:auto;display:flex;align-items:center;gap:8px}
  .tb-sep{width:1px;height:20px;background:var(--line);flex:none;display:none}
  @media (min-width:880px){ .tb-sep{display:block} }
  .tb-pill{display:none}
  .tb-tabs{display:none}
  .tb-league{order:9;flex-basis:100%;display:flex;align-items:center;gap:10px;margin-top:2px;background:linear-gradient(90deg, rgba(255,208,46,.16), var(--card2) 70%);border:1px solid var(--gold);border-radius:14px;padding:9px 12px;color:var(--ink);text-align:left}
  .tb-league .tbl-ic{font-size:20px;flex:none}
  .tb-league .tbl-name{display:flex;flex-direction:column;line-height:1.12;min-width:0;flex:1}
  .tb-league .tbl-label{font-size:10px;letter-spacing:1.2px;color:var(--gold);font-weight:800}
  .tb-league .tbl-title{font-family:'Fredoka';font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-league .tbl-rank{font-family:'Fredoka';font-weight:700;font-size:17px;color:var(--cyan);flex:none}
  .tb-league .caret{font-size:13px;color:var(--gold);font-weight:700;flex:none}
  /* anchored league dropdown (replaces the modal) */
  .lgmenu-bg{position:fixed;inset:0;z-index:60}
  .lgmenu{position:fixed;background:var(--card);border:1px solid var(--gold);border-radius:14px;box-shadow:var(--shadow);padding:10px;max-height:78vh;overflow:auto}
  .lgmenu-head{font-size:10px;letter-spacing:1.2px;color:var(--gold);font-weight:800;margin:2px 0 7px}
  .lgitem{display:flex;align-items:center;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:5px;color:var(--ink);font-weight:600;font-size:14px;text-align:left}
  .lgitem.on{border-color:var(--gold);background:var(--card2)}
  .lgitem .lgi-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lgitem .lgi-r{margin-left:auto;font-family:'Fredoka';color:var(--cyan);font-size:13px;flex:none;padding-left:8px}
  .lgmenu-invite{border-top:1px solid var(--line);margin-top:7px;padding-top:8px}
  .brand{display:flex;align-items:center;gap:8px;font-family:'Fredoka';font-weight:700;font-size:20px;letter-spacing:.5px}
  .brand .ball{font-size:22px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
  .brand b{background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .whoami{display:flex;align-items:center;gap:8px}
  .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--card2);border:2px solid var(--line)}
  .statpills{display:flex;gap:8px;margin-top:10px}
  .pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 10px;text-align:center}
  .pill .k{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
  .pill .v{font-family:'Fredoka';font-weight:700;font-size:17px;line-height:1.1}
  .pill.points .v{color:var(--lime)}
  .pill.coins .v{color:var(--gold)}
  .pill.rank .v{color:var(--cyan)}

  /* 📝 Per-round picks progress (front-page card showing who's submitted) */
  .pickprog .ppsummary{margin:6px 0 10px}
  .pickprog .ppdots{display:flex;flex-wrap:wrap;gap:8px}
  .pickprog .ppdot{position:relative;display:flex;flex-direction:column;align-items:center;width:54px;cursor:default}
  .pickprog .ppdot .avatar{border-width:2px}
  .pickprog .ppdot.done .avatar{border-color:var(--lime);box-shadow:0 0 0 3px rgba(198,255,61,.18)}
  .pickprog .ppdot.partial .avatar{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,208,46,.18)}
  .pickprog .ppdot.none .avatar{border-color:var(--line);opacity:.6}
  .pickprog .ppdot .ppstate{position:absolute;top:-3px;right:6px;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:800;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);font-family:'Fredoka'}
  .pickprog .ppdot.done    .ppstate{background:var(--lime);color:#0c2a08;border-color:var(--lime)}
  .pickprog .ppdot.partial .ppstate{background:var(--gold);color:#2a1a00;border-color:var(--gold)}
  .pickprog .ppdot.none    .ppstate{color:var(--muted)}
  .pickprog .ppdot .ppname{font-size:11px;color:var(--muted);font-weight:600;margin-top:4px;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  /* 🛠️ Admin CRM — KPI cards, sortable tables, activity feed, search */
  .kpigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 16px}
  .kpicard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;position:relative}
  .kpicard .v{font-family:'Fredoka';font-weight:700;font-size:32px;line-height:1.05}
  .kpicard .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;margin-top:4px;font-weight:700}
  .kpicard .delta{font-size:11px;margin-top:4px;color:var(--green);font-weight:600}
  .kpicard .delta.neg{color:var(--red)}
  .kpicard.players .v{color:var(--cyan)}
  .kpicard.leagues .v{color:var(--gold)}
  .kpicard.picks  .v{color:var(--lime)}
  .kpicard.banter .v{color:var(--pink)}
  .kpicard.active .v{color:#3ddc84}
  .kpicard.pot    .v{color:var(--gold)}
  .crmsearch{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;align-items:center}
  .crmsearch input{flex:1;min-width:180px;font-size:14px;padding:9px 12px}
  .crmsearch select{flex:none;width:auto;min-width:140px;font-size:14px;padding:9px 12px}
  .crmsearch .count{font-size:12.5px;color:var(--muted);margin-left:auto;font-weight:600}
  .crmwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0}
  table.crm{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
  table.crm thead{background:var(--card2);position:sticky;top:0;z-index:2}
  table.crm th{text-align:left;padding:11px 10px;font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  table.crm th:hover{color:var(--ink)}
  table.crm th.sorted{color:var(--gold)}
  table.crm th .arr{margin-left:4px;opacity:.5;font-size:10px}
  table.crm th.sorted .arr{opacity:1}
  table.crm td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
  table.crm tbody tr:hover{background:var(--card2)}
  table.crm tbody tr:last-child td{border-bottom:none}
  table.crm .cellnm{display:flex;align-items:center;gap:8px;min-width:140px}
  table.crm .cellnm .avatar{width:30px;height:30px;font-size:15px;flex:none}
  table.crm .cellnm .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
  table.crm .pillpaid{background:rgba(61,220,132,.18);color:#7be0a4;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700}
  table.crm .pillunpaid{background:rgba(255,208,46,.16);color:var(--gold);padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700}
  table.crm .pilladmin{background:rgba(255,208,46,.18);color:var(--gold);padding:1px 7px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.5px}
  table.crm .tinydate{font-size:12px;color:var(--ink)}
  table.crm .tinydate .ago{display:block;font-size:11px;color:var(--muted);margin-top:1px}
  table.crm .rowacts{display:flex;gap:5px;justify-content:flex-end}
  table.crm .rowacts button{padding:4px 8px;font-size:12px}
  /* Activity feed */
  .actfeed{max-height:560px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .actrow{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
  .actrow:last-child{border-bottom:none}
  .actrow:hover{background:var(--card2)}
  .actrow .actic{flex:none;font-size:18px;width:28px;text-align:center}
  .actrow .actwhat{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .actrow .actwhat b{color:var(--ink)}
  .actrow .actwhen{flex:none;font-size:11px;color:var(--muted);white-space:nowrap}
  .actfilters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .actfilters button{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
  .actfilters button.on{background:var(--card2);color:var(--gold);border-color:var(--gold)}
  /* Admin grid: KPIs side-by-side with recent feed on desktop */
  @media(min-width:1080px){
    .adminoverview{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
    .adminoverview .ovleft{min-width:0}
    .adminoverview .ovright{min-width:0}
  }
  /* 🎩 admin header — visually distinct from player so you always know which mode you're in */
  header.top.adminhdr{background:linear-gradient(180deg, rgba(255,208,46,.18), rgba(20,16,40,.85));border-bottom:1px solid var(--gold)}
  header.top.adminhdr .tb-brand{color:var(--gold)}
  header.top.adminhdr .tb-brand b{color:var(--gold)}
  /* 🎩 admin login screen — gold-tinted, sparse, deliberately not player-themed */
  .app.login.adminlogin .hero .big{color:var(--gold)}
  .app.login.adminlogin .card{border-color:var(--gold);box-shadow:0 14px 40px rgba(255,208,46,.18)}
  /* ---------- generic ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0;box-shadow:var(--shadow)}
  .card h3{margin:0 0 4px;font-family:'Fredoka';font-size:18px}
  .muted{color:var(--muted)}
  .small{font-size:14px}
  .tiny{font-size:12.5px}
  .center{text-align:center}
  .row{display:flex;align-items:center;gap:8px}
  .spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
  .chip.live{color:var(--red);border-color:var(--red)}
  .chip.done{color:var(--green);border-color:#2a6e4d}
  .chip.open{color:var(--cyan);border-color:#2a5a6e}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:10px 14px;font-weight:600;font-size:15px;transition:transform .06s ease, filter .15s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(90deg,var(--pink),var(--purple));border:none;color:#fff;box-shadow:0 8px 20px rgba(11,111,179,.4)}
  .btn.dim{opacity:.55}  /* "not ready yet" hint — still fully clickable; tap shows what's missing */
  .btn.lime{background:linear-gradient(90deg,var(--lime),#7be000);border:none;color:#16123a;box-shadow:0 8px 18px rgba(198,255,61,.25)}
  .btn.gold{background:linear-gradient(90deg,var(--gold),#ff9f1c);border:none;color:#2a1a00}
  .btn.ghost{background:transparent}
  .btn.block{width:100%}
  .btn:disabled{opacity:.45;filter:grayscale(.4)}
  input,select,textarea{font-family:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:15px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple)}
  label.fld{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  /* ---------- match card ---------- */
  .match{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
  .match .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .teamline{display:flex;align-items:center;gap:8px}
  .flag{font-size:24px;line-height:1;width:30px;text-align:center}
  .tname{font-weight:600;font-size:16px}
  .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:6px 0}
  .vs .side{display:flex;align-items:center;gap:8px}
  .vs .side.away{flex-direction:row-reverse;text-align:right}
  .scoreinput{width:48px;text-align:center;font-family:'Fredoka';font-size:20px;padding:8px 0}
  .vsmid{font-family:'Fredoka';color:var(--muted);font-size:13px}
  .result-score{font-family:'Fredoka';font-size:22px}
  .pickbar{display:flex;gap:8px;align-items:center;margin-top:10px}
  .earn{font-weight:700}
  .earn.good{color:var(--lime)}
  .earn.bad{color:var(--muted)}
  .odds{display:flex;gap:6px;margin-top:8px}
  .oddbtn{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}
  .oddbtn b{display:block;color:var(--ink);font-family:'Fredoka';font-size:15px}
  .oddbtn.sel{border-color:var(--gold);background:rgba(255,210,63,.12);color:var(--gold)}
  .oddbtn.sel b{color:var(--gold)}

  /* ---------- leaderboard ---------- */
  .lbrow{display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:14px;margin:6px 0;background:var(--card)}
  .lbrow.me{background:linear-gradient(90deg, rgba(11,111,179,.30), rgba(255,208,46,.10));border:1px solid var(--pink)}
  .lbrow .pos{width:30px;text-align:center;font-family:'Fredoka';font-size:18px}
  .lbrow .nm{flex:1;font-weight:600}
  .lbrow .nm small{display:block;color:var(--muted);font-weight:400}
  .lbrow .sc{font-family:'Fredoka';font-size:18px}
  .lbrow .mv{font-size:12px;width:24px;text-align:center}
  .medal{font-size:20px}
  /* hero leaderboard on the dashboard */
  .herogrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:4px}
  @media(min-width:760px){ .herogrid{grid-template-columns:1fr 1fr} }
  .herolb h3{margin:0}
  .herolb .hlb-rows{margin-top:8px}
  .hlb-row{display:flex;align-items:center;gap:9px;padding:6px 2px}
  .hlb-row+.hlb-row{border-top:1px solid var(--line)}
  .hlb-row.me{background:linear-gradient(90deg, rgba(92,200,255,.14), transparent);border-radius:8px}
  .hlb-pos{width:24px;text-align:center;font-family:'Fredoka';font-weight:700;font-size:15px}
  .hlb-nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .hlb-pts{font-family:'Fredoka';font-weight:700;color:var(--lime);white-space:nowrap}
  .hlb-link{background:transparent;border:none;color:var(--cyan);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
  .bbonus{display:inline-block;background:var(--lime);color:#0c2a08;font-family:'Fredoka';font-weight:700;font-size:12px;border-radius:999px;padding:1px 7px;margin-right:6px}
  /* leaderboard bar charts on the dashboard */
  .bchart{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .bcrow{display:grid;grid-template-columns:92px 1fr 40px;align-items:center;gap:8px;font-size:13px}
  .bcnm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .bctrack{height:15px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .bcfill{display:block;height:100%;border-radius:8px;min-width:3px;transition:width .5s ease}
  .bcfill.pts{background:linear-gradient(90deg,var(--cyan),var(--lime))}
  .bcfill.ban{background:linear-gradient(90deg,var(--gold),var(--red))}
  .bcval{text-align:right;font-family:'Fredoka';font-weight:700;font-size:12px;color:var(--ink)}
  .bcrow.me .bcnm{color:var(--cyan)}
  .bcrow.me .bctrack{box-shadow:0 0 0 1px var(--cyan)}
  /* points progression line chart */
  .linechart{margin-top:8px}
  .linechart svg{width:100%;height:auto;display:block}
  .lc-legend{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:10px;font-size:12px}
  .lc-leg{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
  .lc-leg.me{font-weight:700;color:var(--ink)}
  .lc-sw{width:14px;height:4px;border-radius:2px;display:inline-block;flex:none}
  /* projected survivors grid */
  .survgrid{display:grid;grid-template-columns:1fr;gap:4px}
  @media(min-width:760px){ .survgrid{grid-template-columns:1fr 1fr} }
  .survrow{display:grid;grid-template-columns:22px 1fr 1fr 60px;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:12px}
  .survg{font-family:'Fredoka';font-size:14px;color:var(--cyan);text-align:center}
  .survteam{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* knockout bracket tree */
  .bracket{display:flex;gap:14px;overflow-x:auto;padding:6px 4px;align-items:stretch}
  .bcol{display:flex;flex-direction:column;justify-content:space-around;min-width:148px;gap:6px}
  .bcolhead{font-family:'Fredoka';font-weight:700;font-size:12px;color:var(--cyan);text-align:center;padding:4px 0;border-bottom:1px solid var(--line);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
  .btie{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:3px}
  .bteam{display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:6px;background:var(--card2);border:1px solid transparent;color:var(--ink);cursor:pointer;font-size:12px;font-family:inherit;text-align:left;width:100%;transition:transform .08s ease,background .2s}
  .bteam:hover{border-color:var(--cyan)}
  .bteam:active{transform:scale(.97)}
  .bteam.won{background:var(--lime);color:#0c2a08;font-weight:700;border-color:var(--lime)}
  .bteam.lost{opacity:.42}
  .bteam.empty{justify-content:center;color:var(--muted);font-style:italic;cursor:default;background:transparent;border:1px dashed var(--line)}
  .bteam.empty:hover{border-color:var(--line)}
  .bflag{font-size:14px;flex:none}
  .bname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toggle{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
  .toggle button{flex:1;background:transparent;color:var(--muted);border-radius:10px;padding:8px;font-weight:600;font-size:13px}
  .toggle button.on{background:var(--card2);color:var(--ink)}

  /* ---------- nav ---------- */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;justify-content:center;gap:2px;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(12,10,31,.6), rgba(12,10,31,.97));
    backdrop-filter:blur(12px);border-top:1px solid var(--line)
  }
  nav.tabs .inner{display:flex;gap:2px;max-width:540px;width:100%;justify-content:space-around}
  nav.tabs button{background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:12px;font-size:11.5px;font-weight:600;min-width:54px}
  nav.tabs button .ic{font-size:21px}
  nav.tabs button.on{color:var(--ink);background:var(--card)}
  nav.tabs button.on .ic{filter:drop-shadow(0 0 9px rgba(255,208,46,.75))}

  /* ---------- group / bracket ---------- */
  .grphead{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
  .grpbadge{font-family:'Fredoka';font-weight:700;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
  .standrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line)}
  .standrow:last-child{border-bottom:none}
  .standrow .gp{margin-left:auto;font-family:'Fredoka';font-size:13px;color:var(--muted)}
  .advpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .advpick .tg{flex:1;min-width:46%;display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:8px;font-size:13px}
  .advpick .tg.q1{border-color:var(--gold);background:rgba(255,210,63,.1)}
  .advpick .tg.q2{border-color:var(--cyan);background:rgba(54,224,255,.1)}
  /* tap-to-send-through group board */
  .advrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin:7px 0;color:var(--ink);font-size:15px;transition:transform .09s ease,border-color .12s,background .12s}
  .advrow.can{border-style:dashed;border-color:var(--cyan)}
  .advrow.can:hover{border-color:var(--gold);transform:translateY(-1px)}
  .advrow.can:active{transform:scale(.99)}
  .advrow.on{border-color:var(--gold);background:rgba(255,208,46,.13)}
  .advrow[disabled]{cursor:default}
  .advrow .tname{font-weight:600}
  .advtag{font-family:'Fredoka';font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .advtag.on{background:var(--gold);color:#06325e}
  .advtag.hit{background:rgba(61,220,132,.2);color:var(--green)}
  .advtag.miss{background:rgba(226,75,74,.18);color:#ffb3b3}
  .advhint{font-size:12px;color:var(--cyan);font-weight:600;white-space:nowrap}
  /* 💬 banter feed */
  .bmsg{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin:8px 0;transition:opacity .2s, border-color .2s}
  .bmsg-red{border-color:var(--red);background:linear-gradient(180deg,rgba(255,90,90,.10),var(--card))}
  .bmsg-red .bbody{opacity:.55;text-decoration:line-through;text-decoration-color:var(--red)}
  .bmsg-locked{opacity:.78;border-style:dashed}
  .bmsg .bmain{flex:1;min-width:0}
  .bhead{display:flex;align-items:center;gap:4px;font-size:14px}
  .btime{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
  .bbody{font-size:15px;margin:3px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
  .bactions{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
  .likecount{font-size:13px;color:var(--muted);font-weight:600}
  .likecount.wiped{color:var(--red);text-decoration:line-through}
  .likebtn{font-size:12px;font-weight:700;border-radius:8px;padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
  .likebtn.on{border-color:var(--pink);background:rgba(255,107,157,.15);color:#ffd0e0}
  .cardbtn{font-size:13px;font-weight:700;border-radius:8px;padding:5px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .cardbtn.yel{color:#3a2e00;background:#ffd02e;border-color:#caa314}
  .cardbtn.redc{color:#fff;background:var(--red);border-color:#b03636}
  /* ✉️ DMs + 🔔 notifications */
  .nbtn{position:relative}
  .nbadge{position:absolute;top:-5px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;line-height:16px;border-radius:999px;padding:0 4px;text-align:center;font-family:'Fredoka'}
  .convo-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0;color:var(--ink);cursor:pointer;transition:border-color .12s}
  .convo-row:hover{border-color:var(--cyan)}
  .convo-prev{flex:1;min-width:0}
  .convo-prev .nm{display:block;font-weight:700;font-size:14px}
  .convo-prev .pv{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .convo-unread{border-color:var(--gold)}
  .convo-unread .pv{color:var(--ink);font-weight:600}
  .dm-thread{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;padding:4px 2px}
  .dm-bub{max-width:78%;padding:8px 12px;border-radius:14px;font-size:14.5px;overflow-wrap:anywhere;white-space:pre-wrap}
  .dm-bub .dm-t{display:block;font-size:10px;color:var(--muted);margin-top:2px;text-align:right}
  .dm-mine{align-self:flex-end;background:rgba(61,220,132,.16);border:1px solid rgba(61,220,132,.4);border-bottom-right-radius:4px}
  .dm-theirs{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .dmrow{display:flex;gap:8px;margin-top:10px}
  .dmrow input{flex:1;min-width:0}
  .notif-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:13.5px}
  .notif-row:last-child{border-bottom:0}
  .notif-row.fresh{background:rgba(94,210,255,.07)}
  .notif-row .nt{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;padding-left:8px}
  /* 📬 "You've got mail" entrance popup */
  .mailpop .modal{animation:maildrop .55s cubic-bezier(.2,1.4,.4,1);overflow:visible}
  .mailenv{font-size:64px;line-height:1;display:inline-block;animation:mailwiggle 1s ease .45s 2;filter:drop-shadow(0 6px 18px rgba(0,0,0,.4))}
  @keyframes maildrop{0%{transform:translateY(-70px) scale(.75);opacity:0}60%{transform:translateY(6px) scale(1.02)}100%{transform:none;opacity:1}}
  @keyframes mailwiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.1)}50%{transform:rotate(9deg)}75%{transform:rotate(-5deg)}}

  /* ---------- prop ---------- */
  .opt{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;margin:6px 0;font-size:15px}
  .opt.sel{border-color:var(--lime);background:rgba(198,255,61,.1)}
  .opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
  .opt.sel .rd{border-color:var(--lime);background:var(--lime)}

  /* ---------- modal / toast ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(5,4,15,.7);backdrop-filter:blur(4px);z-index:60;display:grid;place-items:center;padding:18px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:22px;max-width:460px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
  .modal .mhead{position:sticky;top:0;background:var(--card);padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .mbody{padding:16px 18px}
  .x{font-size:24px;background:transparent;color:var(--muted);line-height:1}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:12px 18px;border-radius:14px;z-index:80;opacity:0;transition:all .25s;font-weight:600;box-shadow:var(--shadow);max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .banner{border-radius:14px;padding:10px 12px;font-size:12.5px;margin:8px 0}
  .banner.demo{background:rgba(255,210,63,.12);border:1px solid var(--gold);color:var(--gold)}
  .banner.warn{background:rgba(255,92,92,.12);border:1px solid var(--red);color:#ffb3b3}
  .hero{ text-align:center;padding:30px 18px 10px}
  .hero .big{font-family:'Fredoka';font-size:34px;line-height:1.05;margin:8px 0}
  .hero .big b{background:linear-gradient(90deg,var(--pink),var(--gold),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .emojis{font-size:40px;letter-spacing:4px}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .trash{font-style:italic;color:var(--gold);font-size:13px;margin-top:4px}
  .badge-admin{font-size:10px;background:var(--pink);color:#fff;border-radius:6px;padding:2px 6px;font-weight:700;letter-spacing:.5px}
  .empty{ text-align:center;color:var(--muted);padding:30px 10px}
  .empty .e{font-size:40px}
  .seg{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin:4px 0;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
  .seg button.on{background:var(--card2);color:var(--ink);border-color:var(--purple)}
  .seg button.locked{opacity:.5;cursor:not-allowed}
  .seg-rounds{flex-wrap:wrap;justify-content:center}
  .countdown{font-family:'Fredoka';color:var(--cyan)}

  /* ---------- 🇸🇪 SWEDISH / GYÖKERES MAKEOVER ---------- */
  #app{position:relative;z-index:1}
  /* Gyökeres hero photo as a faded full-bleed background, behind everything */
  #gyokbg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.22;
    background:url("gyok.jpg") center top/cover no-repeat}
  #gyokbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,26,46,.2), rgba(10,26,46,.85))}
  @keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes bounceY{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}60%{transform:scale(1.14) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(-3deg);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
  .swstripe{height:5px;margin:-12px -16px 10px;background:linear-gradient(90deg,#0b6fb3 0 36%,#ffd02e 36% 50%,#0b6fb3 50% 100%)}
  .brand .ball{display:inline-block;animation:bounceY 1.4s ease-in-out infinite}
  .brand b{display:inline-block;animation:wobble 3s ease-in-out infinite}
  .mascot{display:inline-block;animation:bounceY 1.6s ease-in-out infinite;font-size:18px}
  .lockbtn{width:34px;height:34px;border-radius:50%;background:var(--card2);border:2px solid var(--line);font-size:15px;line-height:1}
  #celebrate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .15s}
  #celebrate.show{opacity:1}
  #celebrate .cele-card{text-align:center;animation:pop .55s cubic-bezier(.18,1.6,.4,1) both}
  #celebrate svg{width:150px;height:160px;filter:drop-shadow(0 12px 26px rgba(0,0,0,.55))}
  .cele-msg{font-family:'Fredoka';font-size:48px;color:var(--gold);letter-spacing:1px;margin-top:-10px;text-shadow:0 4px 0 #06325e,0 0 18px rgba(255,208,46,.5)}
  .cele-sub{font-family:'Fredoka';color:#fff;background:var(--pink);display:inline-block;padding:5px 14px;border-radius:999px;margin-top:8px;transform:rotate(-3deg);box-shadow:var(--shadow)}
  .heromask svg{width:128px;height:138px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.5))}
  .modal.shake{animation:shake .4s}
  .herophoto img{width:100%;max-width:430px;border-radius:18px;border:3px solid var(--gold);box-shadow:var(--shadow);display:block;margin:0 auto 6px}
  .emojipick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .emojipick .ep{width:38px;height:38px;border-radius:11px;background:var(--bg);border:1px solid var(--line);font-size:19px;line-height:1;transition:transform .08s}
  .emojipick .ep.on{border-color:var(--gold);background:rgba(255,208,46,.16);transform:scale(1.1)}
  .step{display:flex;align-items:center;gap:8px;margin:16px 0 7px;font-size:15px}
  .step .stepn{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;background:var(--gold);color:#06325e;font-weight:800;font-size:12px;font-family:'Fredoka';flex:none}
  .btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.35)}
  /* ---- login readability: bump the small text on the welcome screen ---- */
  .login .hero .muted{font-size:16.5px;line-height:1.55;max-width:430px;margin-left:auto;margin-right:auto}
  .login .hero .big{font-size:36px}
  .login .card h3{font-size:19px}
  .login label.fld{font-size:13px}
  .login .card .small{font-size:14.5px;line-height:1.5}
  .login .card .tiny{font-size:12.5px}
  .login .card input{font-size:16px}
  /* desktop: use a full-width layout — wide hero across the top, signup card + rules side-by-side below */
  .login .loginrow{display:flex;flex-direction:column;gap:14px}
  @media(min-width:880px){
    .app.login{max-width:1240px;margin:0 auto;padding:34px 28px 56px}
    .login .hero{padding:32px 18px 20px}
    .login .hero .big{font-size:48px}
    .login .hero .muted{font-size:18px;max-width:680px}
    .login .herophoto{max-width:440px;margin:0 auto}
    .login .loginrow{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
    .login .card{padding:26px 24px}
    .login .card h3{font-size:21px}
    .login .rules{font-size:15px}
    .login .rules .rrow{padding:8px 0}
  }
  @media(min-width:1200px){
    .app.login{max-width:1320px}
    .login .loginrow{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:32px}
  }
  /* the readable-rules layout */
  .rules{font-size:14.5px;line-height:1.6}
  .rules .lead{margin:0 0 14px;color:var(--ink)}
  .rules h4{font-family:'Fredoka';font-size:15px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:1.3px;margin:16px 0 6px}
  .rules .rrow{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
  .rules .rrow:first-of-type{border-top:none}
  .rules .ric{flex:none;width:24px;text-align:center;font-size:18px}
  .rules .rtx{flex:1}
  .rules .rtx b{color:var(--ink)}
  .rules .terms{color:var(--muted);font-size:12.5px;line-height:1.5;border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
  /* the photo-upload tile on signup */
  .photopick{display:flex;align-items:center;gap:14px;margin-top:6px}
  .photopick .photoavatar{width:78px;height:78px;border-radius:50%;background:var(--card2);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none}
  .photopick .photoavatar img{width:100%;height:100%;object-fit:cover}
  .photopick .photobtns{flex:1;display:flex;flex-direction:column;gap:6px}
  .photopick label.upbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;text-align:center}
  /* login mode tabs */
  .authtabs{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:4px;margin:0 0 14px}
  .authtabs button{flex:1;background:transparent;color:var(--muted);border:none;border-radius:10px;padding:9px;font-weight:600;font-size:14px;cursor:pointer}
  .authtabs button.on{background:var(--card2);color:var(--ink)}
  /* ---------- reveal / banker / podium / streak / countdown ---------- */
  .reveal{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .revhead{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:4px}
  .revrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
  .revrow .re{font-size:16px}
  .revrow .nm{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .revrow b{font-family:'Fredoka'}
  .lockedpick{font-family:'Fredoka';font-size:22px;color:var(--gold);text-align:center}
  .fire{color:#ff8a3d;font-weight:700;font-size:12px;margin-left:4px}
  .hstreak{font-size:12px;font-weight:700;color:#ff8a3d;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 12px}
  .pod{flex:1;max-width:118px;text-align:center}
  .podav{font-size:26px;line-height:1}
  .podname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .podbar{margin-top:4px;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-size:20px;color:#06325e;font-weight:700}
  .pod.p1 .podbar{background:linear-gradient(180deg,#ffd02e,#ff9f1c)}

/* ---------- 🔐 admin gate (visit /admin, sign in as admin/1234) ----
   Architecture: admin is a SEPARATE Supabase account (admin@themask.local), not a
   flag we toggle on a player's profile. Going to /admin signs the player session
   out and signs into the dedicated admin account. Admin never appears as a player
   in any league — no member rows, no leaderboards, no banter, no podium.
   In LIVE mode, RLS still requires the signed-in account to have is_admin=true
   for any cross-league reads or admin writes to succeed. ----- */
const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "1234";        // ⚠️ what the admin types on the form (can be anything)
const ADMIN_DISPLAY_NAME = "admin";   // display name matches the login username
const ADMIN_EMOJI = "🎩";
// 🔐 Supabase enforces a 6+ char password by default. The friendly admin password
// ("1234") is shorter than that, so we deterministically prefix it before sending to
// Supabase — the user keeps typing the short password they're used to, while the
// stored credential is long enough to pass the auth policy. (Change ADMIN_PASSWORD
// and the next sign-in just re-derives the new prefixed credential.)
function adminSupabasePassword(pw){ return "themask-admin:" + String(pw||""); }
let ADMIN_UNLOCKED = (typeof localStorage!=="undefined" && localStorage.getItem("themask_admin")==="1");
let WANT_ADMIN = false;
// In demo mode (no Supabase keys), the admin gate is just a client-side flag flip.
function adminUnlockDemo(){ ADMIN_UNLOCKED=true; try{ localStorage.setItem("themask_admin","1"); }catch(e){} if(ME) ME.is_admin=true; return true; }
async function adminUnlock(pw, user){
  if(user!=null && String(user).trim().toLowerCase()!==ADMIN_USERNAME) return false;
  if(String(pw).trim()!==ADMIN_PASSWORD) return false;
  // Demo mode: no real account switch, just flip the local flag (we're in a sandbox).
  if(MODE!=="live" || !supa){ return adminUnlockDemo(); }
  // Live mode: sign out the current player session and sign in to the dedicated admin account.
  // First time the admin password is used we sign that account up; thereafter we just sign in.
  const adminEmail = pseudoEmail(ADMIN_USERNAME); // "admin@themask.local"
  const sbPw = adminSupabasePassword(pw);         // padded to satisfy Supabase's 6+ char minimum
  try{ await supa.auth.signOut(); }catch(e){}
  let ok=false;
  const {error: siErr} = await supa.auth.signInWithPassword({email:adminEmail, password:sbPw});
  if(!siErr) ok=true;
  else {
    const {data:su, error: suErr} = await supa.auth.signUp({email:adminEmail, password:sbPw, options:{data:{display_name:ADMIN_DISPLAY_NAME}}});
    if(!suErr){
      ok=true;
      // Some Supabase configs require an extra sign-in after sign-up (when email confirm is off, the
      // session is usually returned right away — but belt-and-braces in case it isn't).
      if(!su || !su.session){ const {error:s2}=await supa.auth.signInWithPassword({email:adminEmail, password:sbPw}); if(s2) ok=false; }
    } else { console.error("admin signUp", suErr); }
  }
  if(!ok){
    // Surface the most likely real reason so the user can fix it (rather than just "wrong password").
    console.error("admin sign-in failed", siErr);
    if(siErr && /invalid/i.test(siErr.message||"")) toast("Admin sign-in failed: wrong password 🙅");
    else if(siErr) toast("Admin sign-in error: "+(siErr.message||"unknown"));
    return false;
  }
  // Flip the admin profile's is_admin=true (so RLS lets us read all leagues + write results).
  // We also clear any team/avatar leftovers and force display_name/emoji to the Commissioner identity.
  try{
    const {data:u}=await supa.auth.getUser();
    if(u && u.user){
      await sbUpsert("profiles", {id:u.user.id, display_name:ADMIN_DISPLAY_NAME, emoji:ADMIN_EMOJI, is_admin:true, paid:false, fav_team:null, avatar:null});
      await liveLoad(u.user);
    }
  }catch(e){ console.error("adminUnlock profile", e); }
  ADMIN_UNLOCKED=true;
  try{ localStorage.setItem("themask_admin","1"); }catch(e){}
  return true;
}
async function adminLock(){
  // Signing out of admin mode = full sign-out (admin is its own account). The player can then sign
  // in to their own account from the regular login screen.
  ADMIN_UNLOCKED=false;
  // 🧹 Clear WANT_ADMIN too — it was set at boot when the page first loaded at /admin, but the
  // user is intentionally moving over to the player flow now. Leaving it true would re-trigger
  // the "only the boss runs the show" admin prompt on the very next render() (right after the
  // player signs in), which feels broken.
  WANT_ADMIN=false;
  try{ localStorage.removeItem("themask_admin"); }catch(e){}
  if(MODE==="live" && supa){
    try{ await supa.auth.signOut(); }catch(e){}
  }
  ME=null;
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  // Strip the /admin path and re-render the player login (smoother than a hard nav).
  try{ if(location.pathname !== "/") window.history.replaceState(null, "", "/"); }catch(e){}
  loginScreen();
}

/* ---------- odds engine ---------- */
function teamPower(name){return POWER[name]||62;}
function matchOdds(home,away){
  const dh = (teamPower(home)-teamPower(away))/12 + 0.35; // home edge
  const pHome = 1/(1+Math.exp(-dh));
  const pAwayRaw = 1/(1+Math.exp(dh));
  // carve out a draw chunk
  const draw = 0.26 - Math.abs(pHome-pAwayRaw)*0.12;
  const d = clamp(draw,0.14,0.30);
  let h = pHome*(1-d), a = pAwayRaw*(1-d);
  const s = h+a+d; h/=s;a/=s;
  const margin=1.06;
  const dec=p=>Math.max(1.05, Math.round((1/p)/margin*100)/100);
  return {home:dec(h),draw:dec(d),away:dec(a)};
}
function championOdds(name){
  const p = teamPower(name);
  let o = 6*Math.pow(1.5,(90-p)/3);   // favorites ~6x, minnows up to 300x
  o = clamp(o,6,300);
  return o>=20 ? Math.round(o) : Math.round(o*10)/10;
}

function buildGroupMatches(){
  const pat=[[0,1],[2,3],[0,2],[3,1],[3,0],[1,2]]; // FIFA pairing per matchday
  const md =[1,1,2,2,3,3];
  const matches=[];
  Object.keys(GROUPS).forEach(g=>{
    const tt=DB.teams.filter(t=>t.grp===g);
    pat.forEach((p,k)=>{
      const id=`G-${g}-${k+1}`;
      matches.push({
        id, stage:"group", grp:g, md:md[k],
        home:tt[p[0]].id, away:tt[p[1]].id,
        kickoff:KICKOFFS[id], hs:null, as:null, status:"scheduled"
      });
    });
  });
  return matches;
}

}

/* ============================================================================
   🧮  SCORING ENGINE — recomputed from scratch every render (no drift)
   ============================================================================ */
function groupStandings(g){
  const tt=DB.teams.filter(t=>t.grp===g).map(t=>({id:t.id,name:t.name,flag:t.flag,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0}));
  const map=Object.fromEntries(tt.map(t=>[t.id,t]));
  DB.matches.filter(m=>m.grp===g&&m.status==="finished").forEach(m=>{
    const h=map[m.home],a=map[m.away];if(!h||!a)return;
    h.P++;a.P++;h.GF+=m.hs;h.GA+=m.as;a.GF+=m.as;a.GA+=m.hs;
    if(m.hs>m.as){h.W++;a.L++;h.Pts+=3;}else if(m.hs<m.as){a.W++;h.L++;a.Pts+=3;}else{h.D++;a.D++;h.Pts++;a.Pts++;}
  });
  tt.forEach(t=>t.GD=t.GF-t.GA);
  tt.sort((x,y)=>y.Pts-x.Pts||y.GD-x.GD||y.GF-x.GF||x.name.localeCompare(y.name));
  return tt;
}
// ── Derived standings from a user's scoreline predictions (one of the big shifts:
//    no more "tap to send through" — your group survivors are computed from your picks).
function predictedGroupStandings(uid, g){
  const tt=DB.teams.filter(t=>t.grp===g).map(t=>({id:t.id,name:t.name,flag:t.flag,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0}));
  const map=Object.fromEntries(tt.map(t=>[t.id,t]));
  const matches=DB.matches.filter(m=>m.grp===g);
  let predicted=0;
  matches.forEach(m=>{
    const pr=DB.predictions.find(p=>p.user===uid && p.match===m.id && !p.advance && !p.ko);
    if(!pr || pr.hp==null || pr.ap==null) return;
    predicted++;
    const h=map[m.home],a=map[m.away]; if(!h||!a) return;
    h.P++; a.P++; h.GF+=pr.hp; h.GA+=pr.ap; a.GF+=pr.ap; a.GA+=pr.hp;
    if(pr.hp>pr.ap){ h.W++; a.L++; h.Pts+=3; }
    else if(pr.hp<pr.ap){ a.W++; h.L++; a.Pts+=3; }
    else { h.D++; a.D++; h.Pts++; a.Pts++; }
  });
  tt.forEach(t=>t.GD=t.GF-t.GA);
  tt.sort((x,y)=>y.Pts-x.Pts||y.GD-x.GD||y.GF-x.GF||x.name.localeCompare(y.name));
  return {std:tt, predicted, total:matches.length};
}
function derivedSurvivors(uid, g){ return predictedGroupStandings(uid, g).std.slice(0,2); }
// what's the next un-finished matchday for the picks page default
function currentMD(){ for(const md of [1,2,3]) if(DB.matches.some(m=>m.md===md && m.status!=="finished")) return md; return 3; }
// ⏱ Round-wide picks deadline = 30 min before that matchday's earliest kickoff.
// Until the deadline you can save, edit, unlock and re-lock any pick. After it, every pick in that
// round freezes (the only way to change anything after that is a 🔁 half-time re-pick).
const ROUND_LOCK_BEFORE_MS = 30*60*1000;
function roundDeadline(md){ const ms=DB.matches.filter(x=>x.md===md); if(!ms.length) return null;
  const earliest=Math.min(...ms.map(x=>new Date(x.kickoff).getTime())); return earliest - ROUND_LOCK_BEFORE_MS; }
function roundLocked(md){ const dl=roundDeadline(md); return dl==null ? false : Date.now()>=dl; }
function roundCountdown(md){ const dl=roundDeadline(md); if(dl==null) return null; return fmtCountdown(dl-Date.now()); }
// ⏱ Is a single match's pick frozen? GROUP rounds lock as a whole matchday (≈6 games, same day).
// KNOCKOUT rounds span several days (R32 runs ~6 days), so they must lock PER MATCH — 30 min before
// that individual game — otherwise the first KO kickoff would freeze picks for KO games still days
// away. This is the gate the Save/Edit buttons actually use.
function pickLocked(m){
  if(!m) return false;
  if(isKoMatch(m)) return Date.now() >= new Date(m.kickoff).getTime() - ROUND_LOCK_BEFORE_MS;
  return roundLocked(m.md);   // GROUP matches: whole matchday locks together
}

/* ============================================================================
   🏆  KNOCKOUT BRACKET — a 32-team seeded tree fed by your group-stage picks.
   Each user has their OWN bracket (lineup is derived from their predicted
   standings + best-8 third-placed). Tap a team in any tie to advance them;
   the winner is auto-piped into the next round.
   ============================================================================ */
// 32-team seeded line-up: winners(A..L) + runners(A..L) + 8 best 3rd-placed.
// Seeds 0..31 are then paired R32 as (0v31)(1v30)... so #1 always plays #32.
function userBracketLineup(uid){
  const winners=[], runners=[], thirds=[];
  Object.keys(GROUPS).forEach(g=>{ const std=predictedGroupStandings(uid,g).std; winners.push(std[0]); runners.push(std[1]); if(std[2]) thirds.push(std[2]); });
  const best8=thirds.slice().sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.name.localeCompare(b.name)).slice(0,8);
  return [...winners, ...runners, ...best8]; // 12+12+8 = 32
}
const BRACKET_ROUNDS = [
  {id:'r32', label:'Round of 32', n:16, pts:'r16'},
  {id:'r16', label:'Round of 16', n:8,  pts:'qf'},
  {id:'qf',  label:'Quarter-finals', n:4, pts:'sf'},
  {id:'sf',  label:'Semi-finals', n:2, pts:'final'},
  {id:'f',   label:'Final', n:1, pts:null}
];
// flat tie ids: t1..t16 (R32) → t17..t24 (R16) → t25..t28 (QF) → t29..t30 (SF) → t31 (F)
function tieRound(tieId){ const n=+tieId.slice(1);
  if(n>=1&&n<=16) return 'r32'; if(n>=17&&n<=24) return 'r16'; if(n>=25&&n<=28) return 'qf'; if(n>=29&&n<=30) return 'sf'; if(n===31) return 'f'; return null; }
function downstreamTie(tieId){ const n=+tieId.slice(1);
  if(n>=1&&n<=16) return 't'+(17+Math.floor((n-1)/2));
  if(n>=17&&n<=24) return 't'+(25+Math.floor((n-17)/2));
  if(n>=25&&n<=28) return 't'+(29+Math.floor((n-25)/2));
  if(n>=29&&n<=30) return 't31';
  return null;
}
function downstreamTies(tieId){ const r=[]; let cur=downstreamTie(tieId); while(cur){ r.push(cur); cur=downstreamTie(cur); } return r; }
// Compute the full bracket state for a user — every tie with teamA, teamB, winner (or null).
// Picks that no longer match either slot (because upstream changed) are silently treated as unset.
function userBracketState(uid){
  const lineup=userBracketLineup(uid);
  const byId={}; lineup.forEach(t=>{ if(t&&t.id) byId[t.id]=t; });
  const raw={}; (DB.bracket||[]).filter(p=>p.user===uid).forEach(p=>{ raw[p.tie]=p.team; });
  const ties={};
  const winnerOf = id => { const w=raw[id]; const tie=ties[id]; if(!w||!tie) return null;
    const ok = (tie.teamA && tie.teamA.id===w) || (tie.teamB && tie.teamB.id===w);
    return ok ? w : null; };
  // R32
  for(let i=0;i<16;i++){ const id='t'+(i+1); ties[id]={ id, round:'r32', teamA:lineup[i]||null, teamB:lineup[31-i]||null, winner:null }; ties[id].winner=winnerOf(id); }
  // R16
  for(let i=0;i<8;i++){ const id='t'+(17+i); const a=ties['t'+(2*i+1)], b=ties['t'+(2*i+2)];
    ties[id]={ id, round:'r16', teamA: a.winner?byId[a.winner]:null, teamB: b.winner?byId[b.winner]:null, winner:null }; ties[id].winner=winnerOf(id); }
  // QF
  for(let i=0;i<4;i++){ const id='t'+(25+i); const a=ties['t'+(17+2*i)], b=ties['t'+(18+2*i)];
    ties[id]={ id, round:'qf', teamA: a.winner?byId[a.winner]:null, teamB: b.winner?byId[b.winner]:null, winner:null }; ties[id].winner=winnerOf(id); }
  // SF
  for(let i=0;i<2;i++){ const id='t'+(29+i); const a=ties['t'+(25+2*i)], b=ties['t'+(26+2*i)];
    ties[id]={ id, round:'sf', teamA: a.winner?byId[a.winner]:null, teamB: b.winner?byId[b.winner]:null, winner:null }; ties[id].winner=winnerOf(id); }
  // F
  { const a=ties['t29'], b=ties['t30'];
    ties['t31']={ id:'t31', round:'f', teamA: a.winner?byId[a.winner]:null, teamB: b.winner?byId[b.winner]:null, winner:null }; ties['t31'].winner=winnerOf('t31'); }
  return { lineup, ties };
}
async function pickBracketWinner(tieId, teamId){
  ALL.bracket ||= [];
  const existing = ALL.bracket.find(p=>p.user===ME.id && p.league===LG && p.tie===tieId);
  // Same team tapped twice = untoggle. Any change always cascades-clears every downstream tie.
  const toggleOff = existing && existing.team===teamId;
  const ds = downstreamTies(tieId);
  ALL.bracket = ALL.bracket.filter(p=>!(p.user===ME.id && p.league===LG && (p.tie===tieId || ds.includes(p.tie))));
  const newId = `${ME.id}-${LG}-${tieId}`;
  const created = new Date().toISOString();
  if(!toggleOff){
    ALL.bracket.push({ id:newId, user:ME.id, league:LG, tie:tieId, team:teamId, created });
  }
  scopeLeague(); saveLocal();
  // Mirror to Supabase: wipe downstream picks (server-side), then upsert or delete this tie.
  if(MODE==="live" && supa){
    try{
      if(ds.length){ await supa.from("bracket_picks").delete().eq("user_id",ME.id).eq("league_id",LG).in("tie",ds); }
      if(toggleOff){ await supa.from("bracket_picks").delete().eq("user_id",ME.id).eq("league_id",LG).eq("tie",tieId); }
      else        { await sbUpsert("bracket_picks",{ id:newId, league_id:LG, user_id:ME.id, tie:tieId, team:teamId, created_at:created }); }
    }catch(e){ console.error(e); toast("Bracket sync error"); }
  }
}
async function reloadBracket(){ if(MODE!=="live"||!supa)return;
  try{ const {data}=await supa.from("bracket_picks").select("*");
    ALL.bracket=(data||[]).map(b=>({id:b.id,league:b.league_id,user:b.user_id,tie:b.tie,team:b.team,created:b.created_at}));
    scopeLeague();
  }catch(e){ console.error("reloadBracket",e); }
}
function groupComplete(g){return DB.matches.filter(m=>m.grp===g).every(m=>m.status==="finished");}

// 💬 banter bonus: the top-3 most-liked banterers earn extra standings points (🥇+15 🥈+10 🥉+5).
// Ranked by ❤️ likes; you must have at least one like to place (so nobody wins it just by existing).
function banterRank(uid){ const ranked=topBanter().filter(x=>x.likes>0); return ranked.findIndex(x=>x.user===uid); }
// 💬 Banter score = ❤️ likes received on each of your posts, EXCEPT posts that
// have been red-carded (sent off by 2 yellows + a red). Those posts earn nothing
// at all — every like on them is wiped. Likes on orphaned (deleted) comments
// don't count either. Counted via commentId→authorId + redCard maps for speed.
function banterBonus(uid){
  if(!uid) return 0;
  let n = 0;
  const likes = DB.likes||[], comments = DB.comments||[], cards = DB.cards||[];
  const authorMap = Object.create(null);
  const redMap    = Object.create(null);
  comments.forEach(c=>{ authorMap[c.id] = c.user; });
  cards.forEach(cd=>{ if(cd.kind==="red") redMap[cd.comment] = true; });
  for(const l of likes){
    if(redMap[l.comment]) continue;                  // 🟥 sent-off post → 0 pts
    if(authorMap[l.comment] === uid) n += BANTER_PER_LIKE;
  }
  // Capped at BANTER_CAP so banter stays a ~2% side bonus, never league-deciding.
  return Math.min(BANTER_CAP, n);
}

// 📊 Itemized scoring — single source of truth. Returns every component separately so
// the player-card breakdown and the leaderboard total can never disagree (scoreFor just
// sums this). matchRows carries per-match detail for the card's "receipts" list.
function scoreBreakdown(profileId){
  const s=DB.settings;
  const bd={match:0,groups:0,props:0,bracket:0,fan:0,banter:0,repick:0,matchRows:[]};
  // match score predictions (uses your latest pick: a half-time re-pick overrides the original)
  DB.matches.filter(m=>m.status==="finished").forEach(m=>{
    const pr=effectivePick(profileId,m.id);
    if(!pr||pr.hp==null||pr.ap==null) return;
    const exact = pr.hp===m.hs && pr.ap===m.as;
    const outcome = Math.sign(pr.hp-pr.ap)===Math.sign(m.hs-m.as);
    let add = exact?mpExact(m) : outcome?mpResult(m) : 0;   // stage-weighted: KO rounds worth more
    if(pr.banker) add*=2;   // ⭐ Banker doubles the match points
    bd.match+=add;
    bd.matchRows.push({m,pr,exact,outcome,add});
  });
  // group survivors — DERIVED from your scoreline predictions (no explicit "tap to send through" any more).
  // For each finished group, your projected top-2 are compared against the real top-2; +pts_advance per match.
  Object.keys(GROUPS).forEach(g=>{
    if(!groupComplete(g)) return;
    const real=groupStandings(g);
    const realTop2=new Set([real[0].id, real[1].id]);
    derivedSurvivors(profileId, g).forEach(t=>{ if(realTop2.has(t.id)) bd.groups+=s.pts_advance; });
  });
  // props
  DB.propAnswers.filter(a=>a.user===profileId).forEach(a=>{
    const pr=DB.props.find(x=>x.id===a.prop);
    if(!pr) return;
    if(pr.id==="p-goat"){ if(a.answer==="zlatan") bd.props+=1; else if(a.answer==="ronaldo") bd.props-=1; return; } // 🐐 just-for-fun loyalty test, scores on answer
    if(pr.status!=="settled") return;
    if(String(a.answer)===String(pr.correct)) bd.props+=pr.pts;
  });
  // 🏆 Bracket scoring — picks come from the drag-drop tree (one team per tie).
  // Reward = the points for reaching the NEXT round. R32 winner correct → in real R16 set → +KO_PTS.r16, etc.
  // Final winner = your champion (scored via the Extras prop, not double-counted here).
  const bs = userBracketState(profileId);
  const stageFor = id => tieRound(id);
  const nextStagePoints = { r32:KO_PTS.r16, r16:KO_PTS.qf, qf:KO_PTS.sf, sf:KO_PTS.final };
  const nextReached     = { r32:koReached('r16'), r16:koReached('qf'), qf:koReached('sf'), sf:koReached('final') };
  Object.values(bs.ties).forEach(tie=>{ if(!tie.winner) return; const stg=stageFor(tie.id); const reach=nextReached[stg]; const pp=nextStagePoints[stg];
    if(reach && pp && reach.has(tie.winner)) bd.bracket+=pp;
  });
  // ⚽ fan bonus: +FAN_BONUS pts each finished match your supported team wins
  const fav=(DB.profiles.find(p=>p.id===profileId)||{}).team;
  if(fav){ DB.matches.forEach(m=>{ if(m.status!=="finished")return; if((m.home===fav&&m.hs>m.as)||(m.away===fav&&m.as>m.hs)) bd.fan+=FAN_BONUS; }); }
  // half-time re-pick penalty
  bd.repick = -REPICK_COST * (DB.repicks||[]).filter(r=>r.user===profileId).length;
  // 💬 banter bonus: every ❤️ like received = +1 pt (1-to-1, no podium thresholds)
  bd.banter = banterBonus(profileId);
  bd.total = bd.match+bd.groups+bd.props+bd.bracket+bd.fan+bd.banter+bd.repick;
  return bd;
}
function scoreFor(profileId){ return {pts: scoreBreakdown(profileId).total}; }
// ⚡ Provisional points from matches currently IN PLAY, scored against the live feed
// (m.lhs/m.las) as if the whistle blew right now. Display-only — official totals
// (scoreFor) still only count finished matches, so nothing pays out early.
function livePtsFor(profileId){
  let pts=0; const s=DB.settings;
  const fav=(DB.profiles.find(p=>p.id===profileId)||{}).team;
  DB.matches.forEach(m=>{
    if(!inPlay(m) || m.lhs==null || m.las==null) return;
    const pr=effectivePick(profileId,m.id);
    if(pr&&pr.hp!=null&&pr.ap!=null){
      const exact=pr.hp===m.lhs&&pr.ap===m.las;
      const out=Math.sign(pr.hp-pr.ap)===Math.sign(m.lhs-m.las);
      let add=exact?mpExact(m):out?mpResult(m):0;   // stage-weighted
      if(pr.banker) add*=2;
      pts+=add;
    }
    if(fav && ((m.home===fav&&m.lhs>m.las)||(m.away===fav&&m.las>m.lhs))) pts+=FAN_BONUS;
  });
  return pts;
}

// advance picks stored separately for clarity
let ADV=[]; // {user, grp, team}
function loadAdv(){ ADV = DB.predictions.filter(p=>p.advance).map(p=>({user:p.user,grp:p.grp,team:p.team})); }

function leaderboard(){
  // ⚡ lp = provisional points from in-play matches. The table ranks by PROJECTED total
  // (pts+lp) so the standings move with the live scores, exactly like real league tables
  // do during a matchday. lp is 0 when nothing is live → identical to the old behavior.
  const rows=leagueMembers(LG).map(p=>({...p, pts:scoreFor(p.id).pts, lp:livePtsFor(p.id)}));
  rows.sort((a,b)=> (b.pts+b.lp)-(a.pts+a.lp) || b.pts-a.pts || a.name.localeCompare(b.name));
  rows.forEach((r,i)=>r.rank=i+1);
  return rows;
}
function myRank(){const lb=leaderboard();const r=lb.find(x=>x.id===ME.id);return {rank:r.rank,total:lb.length,me:r};}

function myRankInLeague(lid){

/* ---------- reveal gating + fun stats ---------- */
function profileById(id){return DB.profiles.find(p=>p.id===id);}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function timeAgo(iso){const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<45)return'just now';const m=Math.floor(s/60);if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d';}
// avatar = uploaded photo if present, else the emoji badge
function avatarInner(p){ return (p&&p.avatar) ? `<img class="avimg" src="${p.avatar}" alt=""/>` : (p?(p.emoji||"🙂"):"❓"); }
function myPick(matchId){return DB.predictions.find(p=>p.user===ME.id&&p.match===matchId&&!p.advance);}
function hasPicked(matchId){return !!myPick(matchId);}
// the live/effective pick = your latest half-time re-pick if any, else your original
function effectivePick(userId,matchId){
  const reps=(DB.repicks||[]).filter(r=>r.user===userId&&r.match===matchId);
  const base=DB.predictions.find(p=>p.user===userId&&p.match===matchId&&!p.advance)||null;
  if(reps.length){ const r=reps[reps.length-1]; return {hp:r.hp,ap:r.ap,banker:base?base.banker:false,repick:true}; }
  return base;
}
function inPlay(m){ return m.status!=="finished" && new Date(m.kickoff)<=Date.now(); }
function repicksUsed(userId){ return (DB.repicks||[]).filter(r=>r.user===userId).length; }
function repicksLeft(userId){ return Math.max(0, REPICK_MAX - repicksUsed(userId)); }
function othersFor(matchId){return DB.predictions.filter(p=>p.match===matchId&&!p.advance&&p.user!==ME.id&&p.hp!=null);}
function myAnswer(propId){return DB.propAnswers.find(a=>a.user===ME.id&&a.prop===propId);}
function othersProp(propId){return DB.propAnswers.filter(a=>a.prop===propId&&a.user!==ME.id);}
// ⭐ One Banker per ROUND (a round = matchday MD1/MD2/MD3 for groups, then R32/R16/QF/SF/F).
// You only get ONE 2× multiplier per round, not one per calendar day. Blocked by BOTH already-saved
// Bankers in that round AND a Banker currently toggled on another draft in the same round.
function bankerLockedInRound(md){ return DB.predictions.find(p=>{ if(p.user!==ME.id||!p.banker||p.advance||p.ko) return false; const m=DB.matches.find(x=>x.id===p.match); return m && m.md===md; }); }
function draftBankerInRound(md, exceptMatchId){
  for(const id in DRAFT){ if(id===exceptMatchId) continue; if(!DRAFT[id]||!DRAFT[id].banker) continue;
    const m=DB.matches.find(x=>x.id===id); if(m && m.md===md) return {match:id};
  }
  return null;
}
function canBankMatch(m){
  if(!m) return false;
  const locked=bankerLockedInRound(m.md);
  if(locked && locked.match!==m.id) return false;
  if(draftBankerInRound(m.md, m.id)) return false;
  return true;
}
// Group stage is "finished" when every Round-3 match has finished — gates the projected R32 reveal and the KO rounds.
function groupStageFinished(){ const md3=DB.matches.filter(m=>m.md===3); return md3.length>0 && md3.every(m=>m.status==="finished"); }
// 🃏 Extras (tournament-wide props) lock 1 hour before the FIRST match of the tournament — then frozen for good.
function tournamentStart(){ const ks=DB.matches.map(m=>new Date(m.kickoff).getTime()).filter(t=>!isNaN(t)); return ks.length?Math.min(...ks):null; }
// 🃏 Extras lock at the SAME moment Round 1 (MD1) locks (30 min before the first match).
// That's also when the crowd's answers are revealed — until then, nobody's answers (yours
// or anyone else's) are visible to anyone. Once locked, they stay sealed for the whole
// tournament until each prop is settled by the admin.
function extrasDeadline(){ return roundDeadline(1); }
function extrasLocked(){ const dl=extrasDeadline(); return dl!=null && Date.now()>=dl; }
function extrasCountdown(){ const dl=extrasDeadline(); if(dl==null) return null; return fmtCountdown(dl-Date.now()); }
function nextMatch(){return [...DB.matches].filter(m=>new Date(m.kickoff)>Date.now()&&m.status!=="finished").sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff))[0];}
// knockout futures
function koActual(){ const k=DB.settings.ko||{}; return {r16:k.r16||[],qf:k.qf||[],sf:k.sf||[],final:k.final||[]}; }
function myKO(stage){ return DB.predictions.filter(p=>p.user===ME.id&&p.ko&&p.stage===stage).map(p=>p.team); }
// a team that reached a LATER stage necessarily reached every earlier one, so reaching a stage = union of that stage and all deeper ones
function koReached(stage){ const a=koActual(); const s=new Set(); KO_STAGES.slice(KO_STAGES.indexOf(stage)).forEach(st=>(a[st]||[]).forEach(t=>s.add(t))); return s; }

function statsFor(profileId){
  const finished=DB.matches.filter(m=>m.status==="finished").sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff));
  let streak=0,best=0,exacts=0,upsets=0,hits=0,played=0;
  finished.forEach(m=>{
    const pr=DB.predictions.find(p=>p.user===profileId&&p.match===m.id&&!p.advance);
    if(!pr||pr.hp==null){streak=0;return;}
    played++;
    const exact=pr.hp===m.hs&&pr.ap===m.as, out=Math.sign(pr.hp-pr.ap)===Math.sign(m.hs-m.as);
    if(exact)exacts++;
    if(out){hits++;streak++;best=Math.max(best,streak);
      const w=m.hs>m.as?m.home:(m.hs<m.as?m.away:null);
      if(w){const l=w===m.home?m.away:m.home; if(teamPower(teamById(w).name)<teamPower(teamById(l).name)-6)upsets++;}
    } else streak=0;
  });
  return {streak,best,exacts,upsets,hits,played};
}
function badgesFor(profileId){
  const st=statsFor(profileId), b=[];
  if(st.exacts>=1)b.push(["🎯","Sniper","Nailed an exact scoreline"]);
  if(st.streak>=3)b.push(["🔥","On Fire","3+ correct results in a row"]);
  if(st.upsets>=1)b.push(["🐉","Giant Slayer","Correctly called an upset"]);
  const bankerHit=DB.predictions.some(p=>{ if(p.user!==profileId||!p.banker)return false; const m=DB.matches.find(x=>x.id===p.match); const eff=effectivePick(profileId,p.match); return m&&m.status==="finished"&&eff&&eff.hp!=null&&Math.sign(eff.hp-eff.ap)===Math.sign(m.hs-m.as);});
  if(bankerHit)b.push(["⭐","Banker Boss","Cashed in a Banker pick"]);
  return b;
}

function labelFor(pr,val){ if(val==null||val==="")return "—"; if(pr.type==="team"){const t=teamById(val);return t?`${t.flag} ${t.name}`:val;} if(pr.type==="yesno")return val==="yes"?"Yes":"No"; if(pr.type==="ou")return (val==="over"?"Over ":"Under ")+pr.line; const o=(pr.options||[]).find(o=>o.v==val); return o?o.label:val; }

async function lockPick(matchId, hp, ap, banker){
  if(!LG){ toast("Join a league first"); return; }
  // Refuse to save if the round has already locked.
  const m=DB.matches.find(x=>x.id===matchId); if(m && pickLocked(m)){ toast("⏱ Locked — pick frozen"); return; }
  const pr={id:`${ME.id}-${LG}-${matchId}`,user:ME.id,league:LG,match:matchId,hp,ap,banker:!!banker};
  // Replace any existing pick locally (round-open model — picks are editable until the deadline).
  ALL.pred = ALL.pred.filter(p=>!(p.user===ME.id && p.league===LG && p.match===matchId && !p.advance && !p.ko));
  ALL.pred.push(pr); scopeLeague();
  if(MODE==="live"){
    try{
      // 🏆 Knockout safety net: predictions carry a FK to matches(id). If the admin is the first to
      // pick a freshly-discovered KO fixture, make sure the match row is committed to the server
      // BEFORE the prediction, so the pick can't fail the FK and silently disappear. (Admin-only —
      // the matches table is admin-write; for everyone else the fixture is already on the server.)
      if(m && isKoMatch(m) && ME.is_admin){
        await sbUpsert("matches",{id:m.id,stage:m.stage,grp:m.grp||null,md:m.md,home:m.home,away:m.away,kickoff:m.kickoff,home_score:m.hs??null,away_score:m.as??null,status:m.status||"scheduled"});
      }
      await sbUpsert("predictions",{id:pr.id,user_id:ME.id,league_id:LG,match_id:matchId,hp,ap,banker:pr.banker}); await reloadPredictions();
    }catch(e){ console.error(e); }
  }
  delete DRAFT[matchId]; saveLocal();
}

/* ---------- 💬 banter feed + 🟨🟥 cards ---------- */
// 🆕 Per-post card rules (v2): each ❤️ = +1 pt for the post's author. Anyone can
// give the post a 🟨 yellow card. After 2 yellows have stacked on a post, the next
// dissenter sends a 🟥 red — which nullifies that post entirely (its likes earn 0).
//   No new likes / no new cards / no new reds on a comment from a previous round —
//   they freeze the moment the round changes.
//   The user-level "sent off" suspension stays as a separate fun mechanic
//   (3 user-level red-equivalents → no posting for 30 min).
const CARD_SENDOFF_REDS=3, CARD_SENDOFF_MS=30*60*1000;
// Current "banter round" — group rounds (md1/md2/md3) while we're still in the group
// stage, then a single "ko" bucket for all knockout banter (simple + low-coordination).
function currentBanterRound(){ return groupStageFinished() ? "ko" : ("md"+currentMD()); }
function isCommentLocked(c){ return !!(c && c.round && c.round !== currentBanterRound()); }
function commentYellows(commentId){ return DB.cards.filter(c=>c.comment===commentId && c.kind==="yellow").length; }
function commentReds(commentId){    return DB.cards.filter(c=>c.comment===commentId && c.kind==="red").length; }
function isCommentRedCarded(commentId){ return commentReds(commentId) > 0; }
// "What card can the next person give on this post?" → 'yellow', 'red', or null
function nextCardKind(commentId){
  if(isCommentRedCarded(commentId)) return null;
  return commentYellows(commentId) >= 2 ? "red" : "yellow";
}
function userCards(uid){
  const mine=DB.cards.filter(c=>c.target===uid);
  const yellow=mine.filter(c=>c.kind==="yellow").length, red=mine.filter(c=>c.kind==="red").length;
  // red-equivalent events in time order: every red card, plus every 2nd yellow
  const evs=mine.filter(c=>c.kind==="red").map(c=>new Date(c.created).getTime());
  const ys=mine.filter(c=>c.kind==="yellow").sort((a,b)=>new Date(a.created)-new Date(b.created));
  for(let i=1;i<ys.length;i+=2) evs.push(new Date(ys[i].created).getTime());
  evs.sort((a,b)=>a-b);
  let trigger=0; for(let i=CARD_SENDOFF_REDS-1;i<evs.length;i+=CARD_SENDOFF_REDS) trigger=evs[i];
  const until=trigger?trigger+CARD_SENDOFF_MS:0;
  return {yellow,red,reds:evs.length,until,sentOff:Date.now()<until};
}
function myCardOn(commentId){ return DB.cards.find(c=>c.from===ME.id&&c.comment===commentId); }
function likeCount(commentId){ return DB.likes.filter(l=>l.comment===commentId).length; }

// contribute 0 even if they have likes (those are "wiped" — visible in the UI

/* ---------- live results auto-sync (ESPN public scoreboard) ----------
   Why ESPN: TheSportsDB's free tier caps season listings at 15 events and only
   updates scores long after full time — useless for live. ESPN's scoreboard API is
   keyless, CORS-open, near-real-time, and carries the World Cup as "fifa.world".
   It buckets matches by US/Eastern calendar date, so we query the ET date(s) of
   the fixtures we care about. ---------------------------------------------- */
// Normalized-name aliases (feed name → OUR normalized team name). Values must be in
// nrm()'s post-strip form: lowercase, no [.&], single spaces (so "bosnia herz").
const TEAM_ALIASES={"united states":"usa","korea republic":"south korea","czech republic":"czechia","ivory coast":"côte d'ivoire","cote d'ivoire":"côte d'ivoire","turkey":"türkiye","cape verde":"cabo verde","cape verde islands":"cabo verde","congo dr":"dr congo","democratic republic of congo":"dr congo","dr congo":"dr congo","bosnia and herzegovina":"bosnia herz","bosnia-herzegovina":"bosnia herz","bosnia herzegovina":"bosnia herz"};
function nrm(n){ n=(n||"").toLowerCase().replace(/[.&]/g,"").replace(/\s+/g," ").trim(); return TEAM_ALIASES[n]||n; }
function teamIdByFeedName(feedName){ const t=DB.teams.find(x=>nrm(x.name)===feedName); return t?t.id:null; }
// US-Eastern calendar date (YYYY-MM-DD) for an instant — ESPN buckets its scoreboard by ET date.
function etYmd(ms){ return new Date(ms-4*3600*1000).toISOString().slice(0,10); }
// 🗓️ Official 2026 World Cup knockout date windows (ET) → stage. Lets the sync (a) ask ESPN about
// upcoming KO dates before any fixture exists locally and (b) label a discovered fixture's round.
// The 3rd-place play-off (Jul 18) is bucketed with the semis. Source: FIFA / 2026 KO schedule.
const KO_DATE_STAGE=[
  {from:"2026-06-28",to:"2026-07-03",stage:"r32"},
  {from:"2026-07-04",to:"2026-07-07",stage:"r16"},
  {from:"2026-07-09",to:"2026-07-11",stage:"qf"},
  {from:"2026-07-14",to:"2026-07-15",stage:"sf"},
  {from:"2026-07-18",to:"2026-07-18",stage:"sf"},
  {from:"2026-07-19",to:"2026-07-19",stage:"f"}
];
function koStageForETDate(ymd){ for(const w of KO_DATE_STAGE){ if(ymd>=w.from && ymd<=w.to) return w.stage; } return null; }
// YYYYMMDD strings for every KO calendar day within a few days of `now`, so imminent KO fixtures
// get discovered from the feed even though no local match row exists for them yet.
function upcomingKoQueryDates(now){
  const out=[], lo=etYmd(now-2*864e5), hi=etYmd(now+12*864e5);
  KO_DATE_STAGE.forEach(w=>{ let d=w.from>lo?w.from:lo, end=w.to<hi?w.to:hi;
    for(let cur=d; cur<=end; ){ out.push(cur.replace(/-/g,""));
      const nx=new Date(cur+"T00:00:00Z"); nx.setUTCDate(nx.getUTCDate()+1); cur=nx.toISOString().slice(0,10); }
  });
  return out;
}
let _lastSync=0;
// 📦 Score cache — synced scores live only in this browser until the ADMIN's client
// upserts them to Supabase. Any liveLoad() (page refresh, Supabase token refresh)
// rebuilds DB.matches from the server and would wipe them — so we cache every synced
// score in localStorage and re-apply it after each load. Server truth always wins:
// a match the server says is finished is never overridden by the cache.
const SCORE_CACHE_KEY="themask_scores_v1";
function saveScoreCache(){ try{
  const o={}; DB.matches.forEach(m=>{ if(m.status==="finished"&&m.hs!=null) o[m.id]={hs:m.hs,as:m.as,f:1}; else if(m.lhs!=null) o[m.id]={lhs:m.lhs,las:m.las}; });
  localStorage.setItem(SCORE_CACHE_KEY, JSON.stringify(o));
}catch(e){} }
function applyScoreCache(){ try{
  const o=JSON.parse(localStorage.getItem(SCORE_CACHE_KEY)||"{}");
  const now=Date.now();
  DB.matches.forEach(m=>{ const c=o[m.id]; if(!c || m.status==="finished") return;
    if(c.f){ m.hs=c.hs; m.as=c.as; m.status="finished"; }
    else {
      // Cached LIVE (in-play) scores are only re-applied while the match could plausibly
      // still be in play. A football match can't run longer than ~3h, so a cached "live"
      // score for a game that kicked off more than 4h ago is stale — re-applying it would
      // freeze a half-time-ish provisional score on the leaderboard forever if the final
      // never got synced. Skip it and let a fresh syncResults() finalize the real result.
      if(new Date(m.kickoff).getTime() > now - 4*3600*1000){ m.lhs=c.lhs; m.las=c.las; }
    }
  });
}catch(e){} }
async function syncResults(manual){
  if(typeof fetch!=="function"){ if(manual)toast("Live sync not available here"); return; }
  if(!manual && Date.now()-_lastSync<120000) return; // throttle auto-sync to ~2 min
  _lastSync=Date.now();
  try{
    // Which dates to ask ESPN about: ANY fixture that has kicked off (or is about to, within
    // 30 min) and isn't finished yet — no 48h cut-off. The old 48h backfill window meant that
    // if the admin's client never synced during the ~2 days after a match flipped to "post" on
    // ESPN, that result was skipped forever and never reached Supabase — leaving everyone's
    // leaderboard stuck (e.g. round-2 group games that finished a few days ago). Now every
    // straggler past result gets re-queried whenever the admin opens the app.
    const now=Date.now();
    const cand=DB.matches.filter(m=>{ const t=new Date(m.kickoff).getTime();
      return m.status!=="finished" && t < now+30*60*1000; });
    // Dates to ask ESPN about = ET dates of unfinished local fixtures ∪ imminent knockout dates
    // (so brand-new KO matchups get DISCOVERED and created even before any local row exists).
    const dateSet=new Set(cand.map(m=>etYmd(new Date(m.kickoff).getTime()).replace(/-/g,"")));
    upcomingKoQueryDates(now).forEach(d=>dateSet.add(d));
    // De-dupe, newest first, cap per sync so we never hammer ESPN even with a big backlog.
    const dates=[...dateSet].sort().reverse().slice(0,24);
    if(!dates.length){ if(manual) toast("Nothing to sync right now — next match hasn't kicked off"); return; }
    let n=0, liveN=0;
    for(const d of dates){
      const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=${d}`);
      if(!r.ok) continue;
      const data=await r.json();
      (data.events||[]).forEach(e=>{
        const comp=e.competitions&&e.competitions[0]; if(!comp) return;
        const home=(comp.competitors||[]).find(c=>c.homeAway==="home");
        const away=(comp.competitors||[]).find(c=>c.homeAway==="away");
        if(!home||!away||!home.team||!away.team) return;
        const eh=nrm(home.team.displayName), ea=nrm(away.team.displayName);
        const evMs=new Date(e.date).getTime(), evYmd=etYmd(evMs);
        // Match to a local fixture by team names AND same ET date — the date guard stops a KO
        // rematch (two teams who already met in the groups) from overwriting the group result.
        let m=DB.matches.find(x=>{ const ht=teamById(x.home), at=teamById(x.away); if(!ht||!at) return false;
          const h=nrm(ht.name),a=nrm(at.name); return ((h===eh&&a===ea)||(h===ea&&a===eh)) && etYmd(new Date(x.kickoff).getTime())===evYmd; });
        // Fixtures are baked in (KO_FIXTURES / schema seed), so the sync NEVER invents new rows —
        // it only updates scores of matches we already have. This avoids duplicate KO fixtures.
        if(!m) return;
        const hHome=nrm(teamById(m.home).name)===eh;
        const hs=hHome?parseInt(home.score,10):parseInt(away.score,10);
        const as=hHome?parseInt(away.score,10):parseInt(home.score,10);
        const state=(e.status&&e.status.type&&e.status.type.state)||"";   // pre | in | post
        if(isNaN(hs)||isNaN(as)){ return; }   // no score yet (a freshly-created "pre" fixture) — row still added above
        // 🔴 FINALIZE only on "post" — a live in-play score goes to m.lhs/m.las so the
        // ⚡ LIVE strip + provisional points work without paying out or freezing re-picks early.
        if(state==="post"){
          if(m.hs!==hs||m.as!==as||m.status!=="finished"){ m.hs=hs; m.as=as; m.status="finished"; m.lhs=null; m.las=null; n++;
            if(MODE==="live"&&ME&&ME.is_admin) sbUpsert("matches",{id:m.id,home_score:hs,away_score:as,status:"finished"}); }
        } else if(state==="in" && m.status!=="finished"){
          if(m.lhs!==hs||m.las!==as){ m.lhs=hs; m.las=as; liveN++; }
        }
      });
    }
    if(n||liveN){ saveLocal(); saveScoreCache(); render(); }
    if(manual) toast(n?`Synced ${n} result${n>1?"s":""} ⚽`:liveN?`⚡ Live scores updated`:"No new scores yet — check back after kickoff");
  }catch(e){ console.error(e); if(manual) toast("Couldn't reach the live results service"); }
}
