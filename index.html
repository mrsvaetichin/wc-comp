          <div class="muted">Mode</div><div>${MODE==="live"?'🟢 Live (synced with your league)':'🎮 Demo (sandbox in this browser)'}</div>
        </div>
        <div class="tiny muted" style="margin-top:8px">THE MASK doesn't use email or passwords — you log in just by typing a name on the first screen. Your friends recognise you by your name and badge, not an email address.</div>
      </div>`;
    // ── Leagues block: every league I'm in, with rank + switch ──
    const leaguesRows = LEAGUES.length
      ? LEAGUES.map(l=>{ const rk=myRankInLeague(l.id); const cur=l.id===LG;
          return `<div class="lgitem ${cur?'on':''}" style="display:flex;align-items:center;gap:6px;padding:8px 10px">
            <span style="flex:1;font-weight:600">🏆 ${escapeHtml(l.name)}${cur?' <span class="tiny" style="color:var(--cyan)">· current</span>':''}</span>
            <span class="tiny muted">#${rk.rank}/${rk.total}</span>
            <button class="btn" data-copycode="${l.code}" style="padding:3px 8px;font-size:11px" title="Copy invite code">${l.code}</button>
            ${cur?'':`<button class="btn lime" data-pvswitch="${l.id}" style="padding:4px 10px;font-size:12px">Switch</button>`}
          </div>`;}).join("")
      : `<div class="small muted" style="padding:6px 4px">You're not in any league yet.</div>`;
    const leaguesBlock = `
      <div class="card" style="margin:0 0 10px;padding:10px 12px;text-align:left">
        <div class="spread"><div class="tiny muted" style="letter-spacing:1px">🏆 YOUR LEAGUES <span style="color:var(--cyan)">(${LEAGUES.length})</span></div></div>
        <div style="margin-top:6px;display:flex;flex-direction:column;gap:4px">${leaguesRows}</div>
        <div class="tiny muted" style="margin-top:6px">Want another? Tap the 🏆 chip in the top bar to Create or Join.</div>
      </div>`;
    root.innerHTML=`<div class="modal-bg"><div class="modal">
      <div class="mhead"><b>Profile &amp; account</b>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn" id="pvlogout-top" style="padding:5px 10px;font-size:12px;border-color:var(--red);color:#ffb3b3" title="Sign out of THE MASK">🚪 Sign out</button>
          <button class="x" data-close>×</button>
        </div>
      </div>
      <div class="mbody">
        ${accountBlock}
        ${leaguesBlock}
        <div class="card" style="margin:0 0 10px;padding:10px 12px">
          <div class="tiny muted" style="letter-spacing:1px;margin-bottom:6px">🎭 YOUR LOOK</div>
          <div class="center">
            <div class="avatar" style="width:80px;height:80px;font-size:38px;margin:0 auto">${pendAvatar?`<img class="avimg" src="${pendAvatar}"/>`:pendEmoji}</div>
            <label class="btn block" style="margin-top:10px">📷 Upload a photo<input id="pvfile" type="file" accept="image/*" style="display:none"/></label>
            ${pendAvatar?`<button class="btn ghost block" id="pvclear" style="margin-top:6px">Remove photo</button>`:''}
            <label class="fld" style="text-align:left;margin-top:10px">Name</label>
            <input id="pvname" value="${pendName.replace(/"/g,'&quot;')}" placeholder="Your name"/>
            <label class="fld" style="text-align:left">Or pick an emoji badge</label>
            <div class="emojipick">${EMOJIS.map(e=>`<button class="ep ${pendEmoji===e&&!pendAvatar?'on':''}" data-pe="${e}">${e}</button>`).join("")}</div>
            <label class="fld" style="text-align:left">⚽ Your team <span class="muted tiny">(+${FAN_BONUS} pts every time they win — ${locked?'locked in 🔒 (tournament started)':'change any time until the first match kicks off'})</span></label>
            ${locked
              ? `<div class="opt" style="opacity:.95"><span class="flag">${ft?ft.flag:'🌍'}</span><span>${ft?ft.name:'—'}</span><span style="margin-left:auto" class="tiny muted">🔒</span></div>`
              : `<button class="btn block" id="pvteam" type="button">${ft?`${ft.flag} ${ft.name}`:'🌍 Tap to choose your team'}</button>`}
            <button class="btn primary block" id="pvsave" style="margin-top:12px">Save profile</button>
          </div>
        </div>
        <div class="card" style="margin:0;padding:10px 12px">
          <div class="tiny muted" style="letter-spacing:1px;margin-bottom:6px">👋 SIGN OUT</div>
          <div class="small muted" style="margin-bottom:8px">Drops your identity on this device and sends you back to the login screen. Your picks, league memberships and banter all stay on the server — re-enter your name to come back.</div>
          <button class="btn block" id="pvlogout" style="border-color:var(--red);color:#ffb3b3">👋 Sign out of THE MASK</button>
        </div>
      </div></div></div>`;
    const close=()=>root.innerHTML="";
    $("[data-close]",root).onclick=close;
    $(".modal-bg",root).onclick=e=>{ if(e.target.classList.contains("modal-bg")) close(); };
    $("#pvfile",root).onchange=e=>{ readImageFile(e.target.files[0], url=>{ pendAvatar=url; draw(); }); };
    const clr=$("#pvclear",root); if(clr) clr.onclick=()=>{ pendAvatar=null; draw(); };
    $$("[data-pe]",root).forEach(b=>b.onclick=()=>{ pendEmoji=b.dataset.pe; pendAvatar=null; draw(); });
    const tb=$("#pvteam",root); if(tb) tb.onclick=()=>openTeamPicker(t=>{ pendTeam=t.id; setTimeout(draw,0); });
    $$("[data-pvswitch]",root).forEach(b=>b.onclick=()=>{ close(); switchLeague(b.dataset.pvswitch); });
    $$("[data-copycode]",root).forEach(b=>b.onclick=()=>{ copyText(b.dataset.copycode); toast("Invite code copied 📋"); });
    $("#pvsave",root).onclick=async()=>{
      pendName=$("#pvname",root).value.trim()||pendName;
      const fields={name:pendName,emoji:pendEmoji,avatar:pendAvatar};
      if(!locked && pendTeam) fields.team=pendTeam; // only settable while unlocked
      await updateProfile(fields); close(); toast("Profile saved ✨"); render();
    };
    const doSignOut = ()=>{ confirmModal(`<div class="center"><div style="font-size:36px">👋</div><div style="font-family:'Fredoka';font-size:18px">Sign out of THE MASK?</div><div class="small muted" style="margin-top:6px">You'll return to the login screen and need to re-enter your name to come back. Your picks &amp; leagues stay safe on the server.</div></div>`, ()=>{ close(); logout(); }, "Sign me out"); };
    $("#pvlogout",root).onclick=doSignOut;
    const pvTop=$("#pvlogout-top",root); if(pvTop) pvTop.onclick=doSignOut;
  };
  draw();
}

/* ---------- rules / how-it-works ---------- */
function rulesHTML(){
  const s=DB.settings, buyin=money((curLeague()&&curLeague().buy_in)||s.buy_in||50);
  const split=((curLeague()&&curLeague().payout_split)||s.payout_split||[50,30,20]).join("/");
  const row=(ic,html)=>`<div class="rrow"><span class="ric">${ic}</span><span class="rtx">${html}</span></div>`;
  return `<div class="rules">
    <p class="lead"><b>THE MASK</b> is a friendly World Cup '26 prediction pool. Call the scores, top the table, talk trash, win the pot.</p>

    <h4>The basics</h4>
    ${row("🏆",`<b>Private leagues.</b> Create one and share the invite code, or join with a code. You can be in several at once and switch any time via the 🏆 chip up top.`)}
    ${row("⚽",`<b>Predict every match.</b> <b>${s.pts_exact} pts</b> for the exact score, <b>${s.pts_result} pts</b> for the right result — and these <b>scale up in the knockouts</b> (see below), so a Final bet is worth most.`)}
    ${row("🌍",`<b>Pick your nation.</b> Locked in when you sign up. Bag <b>+${FAN_BONUS} pts</b> every time they win.`)}

    <h4>Rounds &amp; lock-in</h4>
    ${row("✏️",`<b>Edit freely until 30 min before each round kicks off.</b> Save, unlock, and tweak picks as much as you like.`)}
    ${row("🔒",`<b>Then the whole round freezes.</b> No more changes — except a 🔁 half-time re-pick during a live match.`)}
    ${row("🌍",`<b>Times shown in your local timezone</b> (${USER_TZ||'your local clock'}) — kickoff is the same instant for everyone, the clock you see just matches yours.`)}
    ${row("👀",`<b>Blind reveal.</b> Nobody sees anyone's picks until the round locks. Then everyone's choices unlock together.`)}

    <h4>The Banker ⭐</h4>
    ${row("⭐",`<b>One Banker per round</b> (MD1/MD2/MD3 + each knockout round). Tag one pick to score <b>double</b> — exact <b>${s.pts_exact*2}</b>, right result <b>${s.pts_result*2}</b>. No penalty if it misses.`)}

    <h4>Group stage → Knockouts</h4>
    ${row("📊",`<b>Group survivors are computed automatically</b> from your scoreline picks. Each correct top-2 = <b>+${s.pts_advance} pts</b>.`)}
    ${row("⚽",`<b>Knockout match bets — the later the round, the more each is worth.</b> Once the groups finish, the real R32→Final fixtures appear and you predict a scoreline for each, just like the group stage — but the points climb every round (exact score / right result):<br>
      • Round of 32 → <b>${Math.round(s.pts_exact*STAGE_MULT.r32)}</b> / <b>${Math.round(s.pts_result*STAGE_MULT.r32)}</b><br>
      • Round of 16 → <b>${Math.round(s.pts_exact*STAGE_MULT.r16)}</b> / <b>${Math.round(s.pts_result*STAGE_MULT.r16)}</b><br>
      • Quarter-finals → <b>${Math.round(s.pts_exact*STAGE_MULT.qf)}</b> / <b>${Math.round(s.pts_result*STAGE_MULT.qf)}</b><br>
      • Semi-finals → <b>${Math.round(s.pts_exact*STAGE_MULT.sf)}</b> / <b>${Math.round(s.pts_result*STAGE_MULT.sf)}</b><br>
      • <b>Final → ${Math.round(s.pts_exact*STAGE_MULT.f)} / ${Math.round(s.pts_result*STAGE_MULT.f)}</b><br>
      So one good call in the Final is worth ${Math.round(STAGE_MULT.f)}× a group game. One ⭐ Banker per round still doubles.`)}
    ${row("🏆",`<b>Knockout bracket bonus.</b> Separately, your 32-team line-up is built from your group picks; tap a team in each tie to advance them. You also score for every team you advance that actually <b>reaches the next round</b>: R16 <b>+${KO_PTS.r16}</b>, QF <b>+${KO_PTS.qf}</b>, SF <b>+${KO_PTS.sf}</b>, Final <b>+${KO_PTS.final}</b>. Calling the champion is scored in 🃏 Extras.`)}

    <h4>Extras &amp; bonuses</h4>
    ${row("🃏",`<b>Extras:</b> tournament-wide calls — who wins it all (a big <b>+30</b>), top scorer, fun side bets.`)}

    <h4>Half-time re-pick 🔁</h4>
    ${row("🔁",`<b>Change your scoreline mid-match.</b> While a game is live you can swap your pick for a new one — but <b>only during the half-time window, 45–75 min after kickoff</b>. Before or after that, the option simply isn't there (no waiting until the 85th minute to "predict" the score that's already on the board).`)}
    ${row("💸",`<b>It costs ${REPICK_COST} points, paid instantly</b> — win or lose. You get <b>${REPICK_MAX} re-picks for the whole tournament</b>, across all matches.`)}
    ${row("🔄",`<b>The new score fully replaces your original pick</b> and is scored normally at full time (exact ${s.pts_exact} / right result ${s.pts_result}). Your ⭐ Banker stays attached. Re-picked matches show a 🔁 tag so everyone can see it.`)}
    ${row("🧮",`<b>Example:</b> you picked 2–0, it's 0–1 at the break. Re-pick 1–2 for −${REPICK_COST}. Ends 1–2? You net ${s.pts_exact}−${REPICK_COST}=+${s.pts_exact-REPICK_COST} instead of 0. Ends 1–1? You're down the ${REPICK_COST} — gamble responsibly 😄`)}
    ${row("💬",`<b>Banter bonus:</b> Each ❤️ on your banter post = <b>+1 point</b>, but capped at <b>+${BANTER_CAP} pts total</b> — banter is bragging rights, ~2% of a top score, never league-deciding. Anyone can 🟨 book a post; after <b>2 yellows</b> the next dissenter sends a 🟥 red — the post is "sent off" and earns <b>0 points</b>. Likes &amp; cards freeze when the round changes — old posts are locked in.`)}
    ${row("🔥",`<b>Streaks &amp; badges</b> for bragging rights.`)}

    <h4>The money 💰</h4>
    ${row("💸",`<b>Buy-in:</b> ${buyin} per player, paid to the league organiser. <b>Top ${split.split('/').length}</b> split the pot (${split}%). Results sync in live — nobody has to type scores.`)}

    <div class="terms"><b>The friendly bit.</b> THE MASK is a private game among friends — for fun and bragging rights, not a commercial gambling service. Buy-ins are settled between you offline; the app only keeps score. Play responsibly and follow the rules where you live. Live scores are best-effort and the admin can correct any result.</div>
  </div>`;
}
function openRules(){
  const root=$("#modal-root");
  root.innerHTML=`<div class="modal-bg"><div class="modal"><div class="mhead"><b>ℹ️ How it works</b><button class="x" data-close>×</button></div><div class="mbody">${rulesHTML()}<button class="btn primary block" data-close style="margin-top:12px">Got it ⚽</button></div></div></div>`;

function updateLoginBtn(){
  const btn=$("#loginbtn"); if(!btn) return;
  // Always sync from the live DOM (catches autofill / paste / IME that don't fire 'input').
  const em=$("#email"), pw=$("#pw"), jc=$("#joincode");

  if(pw) pendingPassword = pw.value;
  if(jc) pendingJoinCode = jc.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const isLive = MODE==="live";
  const isSignup = authMode==="signup";
  const u = (pendingUsername||"").trim();
  const p = pendingPassword||"";
  let ok=false, hint="";
  if(isLive && !isSignup){
    ok = u.length>0 && p.length>=6;
    hint = ok ? "Tap Sign in 🚪" : "Enter your username and password to sign in.";
  } else if(isLive && isSignup){
    ok = u.length>=2 && p.length>=6 && !!pendingTeam;
    hint = u.length<2 ? "Pick a username (2+ chars)" : p.length<6 ? "Choose a password (6+ chars)" : !pendingTeam ? "Pick your nation to continue 🌍" : "All set — tap Create my account 🎉";
  } else {
    ok = u.length>0 && !!pendingTeam;
    hint = ok ? "Next: join or create a league to play 🏆" : (u? "Pick your nation to continue 🌍" : "Enter a name and pick your nation to continue.");
  }
  // IMPORTANT: never disable the button — always allow clicking. doLogin re-validates and shows
  // a precise toast about what's missing. This avoids the "button feels stuck" trap when an input
  // event doesn't fire (autofill, paste, mobile keyboards). Use visual style to hint readiness.
  btn.disabled = false;
  btn.classList.toggle("dim", !ok);
  const h=$("#loginhint"); if(h) h.textContent = hint;
}
// Build a deterministic placeholder email under a local-only domain (Supabase wants an email field).
// Username-only login: the email is never used, never displayed, and never confirmed.
function pseudoEmail(username){ return String(username||"").toLowerCase().replace(/[^a-z0-9._-]/g,"")+"@themask.local"; }
async function doLogin(){
  const isLive = MODE==="live";
  // Always read from the persistent state, not the DOM (DOM may have just been re-rendered).
  // Belt-and-braces: also pull whatever's currently in the inputs so a click-then-submit
  // before oninput fires still picks up the latest typed value.
  if($("#email")) pendingUsername = $("#email").value;
  if($("#pw")) pendingPassword = $("#pw").value;
  if($("#joincode")) pendingJoinCode = $("#joincode").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
  const username = (pendingUsername||"").trim();
  const password = pendingPassword||"";
  const joinCode = (pendingJoinCode||"").trim();
  if(joinCode) PENDING_JOIN = joinCode;
  const isSignup = authMode==="signup";
  // Precise field-level validation: each missing piece gets its own toast so the user knows what to fix.
  if(!username){ toast(isLive?"Type your username 🙂":"Type your name first 🙂"); return; }
  // 🎩 "admin" is the commissioner's reserved name — never a player. If someone types it on the
  // player login (sign-in OR sign-up), don't try to sign them up as a player. Route them to the
  // admin flow instead so they don't accidentally clobber the admin account's is_admin flag.
  if(isLive && username.toLowerCase() === ADMIN_USERNAME){
    if(isSignup){ toast(`"${ADMIN_USERNAME}" is reserved — pick another username 👑`); return; }
    if(await adminUnlock(password, username)){
      toast("Welcome, boss! 🛠️"); celebrate("BOSS MODE!"); VIEW="admin"; render();
    } else {
      toast("Wrong admin password 🙅");
    }
    return;
  }
  if(isLive && isSignup && username.length<2){ toast("Username needs 2+ characters 👤"); return; }
  if(isLive && password.length<6){ toast("Password needs 6+ characters 🔒"); return; }
  if(isSignup && !pendingTeam){ toast("Pick your nation first 🌍"); return; }
  const emoji=pendingEmoji||"🫵";
  if(isLive){
    const email = pseudoEmail(username);
    try{
      if(isSignup){
        const {data, error} = await supa.auth.signUp({ email, password, options:{ data:{ display_name:username } } });
        if(error){
          if(/registered|exists|already/i.test(error.message)) toast("Username already taken — pick another or use Sign in 👤");
          else toast("Sign up failed: "+error.message);
          return;
        }
        // Supabase quirk: with "Confirm email" off, signUp on an existing email returns success but
        // user.identities is empty (an "obfuscated user" — no new account was created).
        if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
          toast("Username already taken — pick another or use Sign in 👤");
          try{ await supa.auth.signOut(); }catch(e){}
          return;
        }
        // If the project still requires email confirmation, the session will be null and we can't proceed.
        if(!data.session){
          const {error:siErr} = await supa.auth.signInWithPassword({ email, password });
          if(siErr){ toast("Disable 'Confirm email' in Supabase Auth → see SETUP"); console.error(siErr); return; }
        }
      } else {
        const {error} = await supa.auth.signInWithPassword({ email, password });
        if(error){ toast(/credentials/i.test(error.message)?"Wrong username or password 🤔":"Sign in failed: "+error.message); return; }
      }
      const {data:u}=await supa.auth.getUser();
      const uid=u.user.id;
      const profileFields = {id:uid, display_name:username, emoji, is_admin:false, paid:false, last_seen_at:new Date().toISOString()};
      if(pendingTeam) profileFields.fav_team = pendingTeam;
      if(pendingAvatar) profileFields.avatar = pendingAvatar;
      // 🌐 Capture the user's browser timezone + locale at signup. Privacy-friendly proxy
      // for "where from" — no IP, no geolocation permission prompt, just IANA TZ + language.
      if(isSignup){ const ci=clientSignupInfo(); profileFields.signup_tz=ci.signup_tz; profileFields.signup_locale=ci.signup_locale; }
      await sbUpsert("profiles", profileFields);
      await liveLoad(u.user);
      if(ME){ ME.name=username; ME.emoji=emoji; if(pendingAvatar) ME.avatar=pendingAvatar; if(pendingTeam&&!ME.team) ME.team=pendingTeam; }
      await applyPendingJoin();
      celebrate(isSignup?"WELCOME!":"LET'S GO!"); VIEW="picks"; render();
    }catch(e){ toast("Auth error — check your Supabase settings"); console.error(e); }
    return;
  }
  // demo: create/use a profile by the typed name (no password needed)
  let p=DB.profiles.find(x=>x.name.toLowerCase()===username.toLowerCase());
  if(!p){ p={id:"me",name:username,emoji,email:username+"@demo",is_admin:false,paid:true,team:pendingTeam||null,avatar:pendingAvatar||null};
    DB.profiles=DB.profiles.filter(x=>x.id!=="me"); DB.profiles.unshift(p); }
  else { p.emoji=emoji; if(pendingAvatar) p.avatar=pendingAvatar; if(pendingTeam&&!p.team) p.team=pendingTeam; }
  ME=p; saveLocal();
  await applyPendingJoin();   // honour the invite code typed on the form (or ?join=… from the URL)
  celebrate("LET'S GO!"); VIEW="picks"; render();
}

// 🛟 Resilient loader for the Supabase library. The <head> requests it from jsdelivr; if that CDN is
// blocked or slow (a single blocked CDN shouldn't lock anyone out of login), fall through to other
// CDNs — including cloudflare/cdnjs, the same host the confetti script already loads from.
const SUPA_CDNS=[
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",        // (also requested in <head>)
  "https://unpkg.com/@supabase/supabase-js@2",
  "https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.7/supabase.min.js"
];
function injectScript(src){ return new Promise(res=>{ const s=document.createElement("script"); s.src=src; s.async=true;
  s.onload=()=>res(true); s.onerror=()=>res(false); document.head.appendChild(s); }); }
async function ensureSupabase(){
  const waitFor=async ticks=>{ for(let i=0;i<ticks && !window.supabase;i++) await new Promise(r=>setTimeout(r,50)); };
  await waitFor(120);                                  // ~6s grace for the <head> tag (CDN[0])
  for(let i=1;i<SUPA_CDNS.length && !window.supabase;i++){
    await injectScript(SUPA_CDNS[i]); await waitFor(80); // ~4s per fallback CDN
  }
  return !!window.supabase;
}
function bootingScreen(msg){
  $("#app").innerHTML=`<div class="app"><div class="hero" style="padding-top:60px">
    <div class="herophoto"><img src="gyok.jpg" alt=""/></div>
    <div class="big">Loading <b>THE MASK</b>…</div>
    <div class="muted">${msg||"Warming up the pitch ⚽🦇"}</div></div></div>`;
}
function withTimeout(p, ms, label){ return Promise.race([Promise.resolve(p), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout:"+(label||""))), ms))]); }
async function applyPendingJoin(){ if(PENDING_JOIN){ const c=PENDING_JOIN; PENDING_JOIN=null; try{ await joinLeague(c); }catch(e){ console.error(e); } } }
async function boot(){
  WANT_ADMIN = isAdminRoute();
  startTicker();   // 🕐 once-only setInterval that ticks every countdown on the page
  // 🔴 Auto-refresh scores whenever any match has kicked off (or is about to, within 30 min)
  // and still has no stored result — no 48h cut-off, so older unfinished results keep getting
  // chased until they land. (syncResults throttles itself to ~1 call per 2 min and only
  // re-renders when something actually changed.)
  setInterval(()=>{ try{ const now=Date.now();
    const hasOpenMatch = DB.matches.some(m=>{ const t=new Date(m.kickoff).getTime(); return m.status!=="finished" && t<now+30*60*1000; });
    // Also sync when a knockout date is imminent, so brand-new KO fixtures get discovered even
    // if every existing (group) match is already finished and waiting on the bracket.
    const koSoon = upcomingKoQueryDates(now).length>0;
    if(ME && (hasOpenMatch || koSoon)) syncResults(false);
  }catch(e){} }, 150000);
  // ✉️🔔 poll DMs + banter activity every 25s so messages and the bell stay fresh.
  // Badge updates happen in place (no re-render); an open conversation refreshes itself.
  setInterval(async()=>{ try{
    if(MODE!=="live"||!supa||!ME||ME.is_admin||!LG) return;
    await reloadMessages(); await reloadComments();
    updateNotifBadges();
    notifyNewCards();
    if(typeof _refreshOpenConvo==="function"&&_refreshOpenConvo) _refreshOpenConvo();
  }catch(e){} }, 25000);
  try{ const j=new URL(location.href).searchParams.get("join"); if(j) PENDING_JOIN=j; }catch(e){}
  const haveKeys = !!(SUPABASE_URL && SUPABASE_ANON);
  if(haveKeys){
    MODE="live";
    bootingScreen(); // never show a blank/frozen background while we connect
    // the Supabase library loads from a CDN — try jsdelivr (head), then unpkg, then cloudflare
    if(!await ensureSupabase()){
      loadError("The login library didn't load — a browser extension or your network may be blocking it. Turn off ad/script blockers for this site and reload.");
      return;
    }
    // Connect with retries. A healthy project that has just woken from idle (or a far-away region —
    // this one is in Tokyo) can be slow on its FIRST request, so a single 20s timeout could fail the
    // whole boot even though the backend is fine. We retry a few times with backoff before giving up.
    supa=supa||window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
    let connected=false, lastErr=null;
    for(let attempt=1; attempt<=4 && !connected; attempt++){
      try{
        const {data}=await withTimeout(supa.auth.getSession(), 25000, "session");
        if(data&&data.session){ await withTimeout(liveLoad(data.session.user), 30000, "load"); await applyPendingJoin(); render(); }
        else if(WANT_ADMIN){
          // /admin route + no session → go straight to a dedicated admin login screen.
          // Never show the player signup form on /admin; admin is its own world.
          Object.assign(DB,{settings:{...DEFAULTS}, teams:buildTeams()});
          adminLoginScreen();
        }
        else { Object.assign(DB,{settings:{...DEFAULTS}, teams:buildTeams()}); loginScreen(); } // pre-seed the static team list so the signup "who do you support?" picker works before auth
        connected=true;
      }catch(e){
        lastErr=e; console.error("connect attempt "+attempt+" failed",e);
        if(attempt<4){ if($("#app")) bootingScreen(`Connecting… (attempt ${attempt+1})`); await new Promise(r=>setTimeout(r, 1500*attempt)); }
      }
    }
    if(connected){
      supa.auth.onAuthStateChange(async (_e,session)=>{
        if(session&&session.user){ try{ await withTimeout(liveLoad(session.user),30000,"load"); await applyPendingJoin(); render(); }catch(e){ console.error(e); } }
      });
    } else {
      console.error("connect: all attempts failed", lastErr);
      loadError("Couldn't reach the server after a few tries — your connection may have dropped, or the project may be paused (free-tier projects sleep after ~7 days idle). Tap to retry.");
    }
    return;
  }
  // No keys configured → DEMO
  MODE="demo";
  if(!loadLocal()) seedDemo();
  if(!ME) ME=DB.profiles.find(p=>p.id==="me")||DB.profiles[0];
  render();
}

async function liveLoad(user){
  // 🚫 Banned check FIRST. If an admin removed this account, bow out instead of silently
  // re-creating the profile below — that re-creation is exactly what made deleted users
  // "come back". If the bans table doesn't exist yet (schema not re-run), this throws and we
  // just carry on as before. (Admins are never bannable — skip so you can't lock yourself out.)
  try{
    const isAdminAcct = (user.email||"").toLowerCase() === (pseudoEmail(ADMIN_USERNAME)||"").toLowerCase() || ADMIN_EMAILS.includes((user.email||"").toLowerCase());
    if(!isAdminAcct){
      const { data:banRows } = await supa.from("bans").select("id").eq("id", user.id);
      if(banRows && banRows.length){
        try{ await supa.auth.signOut(); }catch(e){}
        $("#app").innerHTML=`<div class="app"><div class="hero"><div class="herophoto"><img src="gyok.jpg" alt=""/></div>
          <div class="big"><b>${(DB.settings&&DB.settings.app_title)||"THE MASK"}</b></div></div>
          <div class="banner warn"><b>You've been removed from the pool.</b><br>An admin removed this account. Talk to your league organiser if you think it's a mistake.</div>
          <button class="btn primary block" onclick="location.reload()">Back to start</button></div>`;
        return;
      }
    }
  }catch(e){ console.error("ban check (bans table may not exist yet)", e); }
  // pull everything into the same shape the UI expects
  const tbl=async n=>{ try{ const {data}=await supa.from(n).select("*");return data||[]; }catch(e){ console.error("load "+n,e); return []; } };
  const [settings,teams,matches,props,preds,answers,profiles,advances,kopicks,reps,leagues,memberships,comments,cards,likes,bracketPicks,messages]=await Promise.all(
    ["settings","teams","matches","props","predictions","prop_answers","profiles","advances","ko_picks","repicks","leagues","memberships","comments","cards","likes","bracket_picks","messages"].map(tbl));
  DB.settings = (settings&&settings[0]) ? settings[0] : {...DEFAULTS};
  if(!DB.settings.ko) DB.settings.ko={r16:[],qf:[],sf:[],final:[]};
  DB.teams = teams.length?teams.map(t=>({id:t.id,name:t.name,flag:t.flag,grp:t.grp,pos:t.pos})):buildTeams();
  DB.matches = matches.length?matches.map(r=>({id:r.id,stage:r.stage,grp:r.grp,md:r.md,home:r.home,away:r.away,kickoff:r.kickoff,hs:r.home_score,as:r.away_score,status:r.status})):buildGroupMatches();
  applyScoreCache();   // 📦 re-apply locally-synced scores the server doesn't have yet (see saveScoreCache)
  ensureKoFixtures();  // 🏆 make sure the decided knockout fixtures are present (admin publishes any missing)
  DB.props = props.length?props.map(normalizeProp):seedProps();
  DB.profiles = profiles.map(p=>({
    id:p.id, name:p.display_name||p.email, emoji:p.emoji||"🙂",
    avatar:p.avatar||null, team:p.fav_team||null, email:p.email,
    is_admin:!!p.is_admin,
    // 📊 audit fields shown in the admin user-detail view
    created_at:p.created_at, last_seen_at:p.last_seen_at,
    signup_tz:p.signup_tz, signup_locale:p.signup_locale
  }));
  // 🏆 leagues + memberships (LEAGUES = only the ones I'm in)
  const myIds=new Set((memberships||[]).filter(m=>m.user_id===user.id).map(m=>m.league_id));
  const lgMap=l=>({id:l.id,name:l.name,code:l.code,buy_in:l.buy_in,currency:l.currency,payout_split:l.payout_split,created_by:l.created_by,created_at:l.created_at});
  ALL_LEAGUES=(leagues||[]).map(lgMap);
  LEAGUES=(leagues||[]).filter(l=>myIds.has(l.id)).map(lgMap);
  MEMBERS=(memberships||[]).map(m=>({league:m.league_id,user:m.user_id,paid:!!m.paid,joined_at:m.joined_at}));
  // every league's picks → master store (scoped per-league at render time)
  ALL.pred = preds.map(p=>({id:p.id,user:p.user_id,league:p.league_id,match:p.match_id,hp:p.hp,ap:p.ap,banker:p.banker,created:p.created_at}))
    .concat(advances.map(a=>({id:a.id,user:a.user_id,league:a.league_id,advance:true,grp:a.grp,team:a.team,created:a.created_at})))
    .concat((kopicks||[]).map(k=>({id:k.id,user:k.user_id,league:k.league_id,ko:true,stage:k.stage,team:k.team,created:k.created_at})));
  ALL.pans = answers.map(a=>({id:a.id,user:a.user_id,league:a.league_id,prop:a.prop_id,answer:a.answer,created:a.created_at}));
  ALL.rep  = (reps||[]).map(r=>({id:r.id,user:r.user_id,league:r.league_id,match:r.match_id,hp:r.hp,ap:r.ap}));
  ALL.comments = (comments||[]).map(c=>({id:c.id,league:c.league_id,user:c.user_id,body:c.body,created:c.created_at,round:c.round||'md1'}));
  ALL.cards    = (cards||[]).map(c=>({id:c.id,league:c.league_id,comment:c.comment_id,from:c.from_id,target:c.target_id,kind:c.kind,created:c.created_at}));
  ALL.likes    = (likes||[]).map(l=>({id:l.id,league:l.league_id,comment:l.comment_id,user:l.user_id,created:l.created_at}));
  ALL.bracket  = (bracketPicks||[]).map(b=>({id:b.id,league:b.league_id,user:b.user_id,tie:b.tie,team:b.team,created:b.created_at}));
  ALL.msgs     = (messages||[]).map(m=>({id:m.id,league:m.league_id,from:m.from_id,to:m.to_id,body:m.body,created:m.created_at,read:m.read_at}));
  // ensure my profile exists
  let mine=DB.profiles.find(p=>p.id===user.id);
  // 🎩 Is this the dedicated admin account? Detect by the pseudo-email — survives
  // race conditions (auth listener firing liveLoad before our adminUnlock upserts is_admin),
  // and auto-corrects any stale is_admin=false row in the DB on every load.
  const userEmail = (user.email||"").toLowerCase();
  const isAdminAccount = userEmail === (pseudoEmail(ADMIN_USERNAME)||"").toLowerCase();
  if(!mine){
    const isAdmin = isAdminAccount || ADMIN_EMAILS.includes(userEmail);
    mine={id:user.id,name:(user.email||"Player").split("@")[0],emoji:"🫵",email:user.email,is_admin:isAdmin};
    DB.profiles.push(mine);
    await sbUpsert("profiles",{id:user.id,email:user.email,display_name:mine.name,emoji:mine.emoji,is_admin:isAdmin,paid:false});
  }
  ME=mine;
  // Locally force is_admin=true for the admin pseudo-email; also push a correction to the DB
  // (fire-and-forget) if the stored row says false — this self-heals if the upsert in
  // adminUnlock raced against the auth listener.
  if(isAdminAccount){
    ME.is_admin = true;
    mine.is_admin = true;
    if(supa){ try{ supa.from("profiles").upsert({id:user.id, is_admin:true, display_name:ADMIN_DISPLAY_NAME, emoji:ADMIN_EMOJI}); }catch(e){} }
  }
  // 📊 Touch last_seen_at fire-and-forget on every load so admin can see active vs
  // inactive players. Also backfill signup_tz / signup_locale for any pre-existing profile
  // that hasn't been captured yet (these were added after some users had already signed up).
  if(supa && ME){
    const touch={id:ME.id, last_seen_at:new Date().toISOString()};
    if(!mine.signup_tz)     touch.signup_tz     = USER_TZ || null;
    if(!mine.signup_locale) touch.signup_locale = USER_LOCALE || null;
    try{ supa.from("profiles").upsert(touch); }catch(e){} // fire-and-forget — never block render
    Object.assign(ME, touch);
  }
  // pick the current league (last used if still a member, else first)
  const stored=(typeof localStorage!=="undefined"&&localStorage.getItem(LG_KEY))||null;
  LG = (LEAGUES.find(l=>l.id===stored)?stored:(LEAGUES[0]&&LEAGUES[0].id)) || null;
  scopeLeague();
  _lastSync=0; syncResults(false); // fresh data just loaded → always re-pull scores (bypass throttle)
}
function normalizeProp(p){return {id:p.id,icon:p.icon,q:p.q,type:p.type,options:p.options,line:p.line,pts:p.pts,status:p.status,correct:p.correct,allow_coins:p.allow_coins};}

boot();
</script>
